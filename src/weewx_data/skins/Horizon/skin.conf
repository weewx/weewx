###############################################################################

SKIN_NAME = Horizon
SKIN_VERSION = 5.5.0

###############################################################################

[Extras]

    # The address of a radar picture for the 'imagery' panel, and the address that
    # the picture links to.
    #radar_img = https://example.com/radar.png
    #radar_url = https://example.com/radar.html

    # The same for a satellite picture.
    #satellite_img = https://example.com/satellite.png
    #satellite_url = https://example.com/satellite.html

    # To display a map of the station, enter an API key for Google Maps.
    #google_map_apikey = xxx

    # If you have a Google Analytics GA4 tag, uncomment and edit the next line.
    #googleAnalyticsId = G-ABCDEFGHI


###############################################################################

[DisplayOptions]

    # How often, in seconds, the page asks for current data. 0 turns the live update off.
    refresh_interval = 60

    # Which panels the front page shows, and in what order. Each name is an .inc file in the skin directory.
    # Possibilities are 'current', 'forecast', 'sun', 'moon', 'sunmoon', 'planets', 'imagery', 'sensors', 'history' (the
    # charts), and 'hilo' (the statistics table). See "Customizing the Horizon skin" in the Customization Guide for how
    # to build your own panel.
    panels = current, forecast, sunmoon, planets, imagery, sensors, history, hilo

    # Which types appear in "current conditions", and in what order.
    observations_current = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, UV, radiation, lightning_strike_count, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, pm1_0, pm2_5, pm10_0

    # Which types appear in the statistics table and on the statistics page, and in
    # what order.
    observations_stats = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, ET, hail, hailRate, snow, UV, radiation, lightning_strike_count, lightning_distance, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, extraTemp3, extraHumid3, extraTemp4, extraHumid4, leafTemp1, leafTemp2, leafWet1, leafWet2, soilTemp1, soilTemp2, soilTemp3, soilTemp4, soilMoist1, soilMoist2, soilMoist3, soilMoist4, pm1_0, pm2_5, pm10_0, co, co2, nh3, no2, o3, so2

    # Which types appear in the RSS feed.
    observations_rss = outTemp, inTemp, barometer, windSpeed, rain, rainRate, windchill, heatindex, dewpoint, outHumidity, inHumidity

    # Some observations display a sum rather than min/max values
    obs_type_sum = rain, ET, hail, snow, lightning_strike_count

    # Some observations display only the max value
    obs_type_max = rainRate, hailRate, snowRate, UV

    # Which types of sensor status the sensors panel and the telemetry page show,
    # and in what order.
    sensor_connections = rxCheckPercent, signal1, signal2, signal3, signal4, signal5, signal6, signal7, signal8
    sensor_batteries = outTempBatteryStatus, inTempBatteryStatus, rainBatteryStatus, hailBatteryStatus, snowBatteryStatus, windBatteryStatus, uvBatteryStatus, txBatteryStatus, batteryStatus1, batteryStatus2, batteryStatus3, batteryStatus4, batteryStatus5, batteryStatus6, batteryStatus7, batteryStatus8
    sensor_voltages = consBatteryVoltage, heatingVoltage, supplyVoltage, referenceVoltage

    # Which charts the 'history' panel shows, and in what order. The names refer to the plot groups defined under
    # [[JSONFiles]] in the [JSONGenerator] section. For example, the name 'wind' refers to [[[wind]]], which
    # writes the files 'wind-2026-07-13.json' and so on. How each chart looks is set under [[Charts]] below.
    plot_groups = tempdew, tempfeel, hum, barometer, wind, winddir, windvec, rain, radiation, UV, ET, lightning, tempin, humin, tempext, humext, templeaf, wetleaf, tempsoil, moistsoil, pm

    # The same for the telemetry page.
    telemetry_plot_groups = rx, volt

    # The time spans offered for the charts. [[TimeLengths]] below sets how long each one is.
    periods = day, week, month, year

    # Which planets the 'planets' panel lists, and in what order. Any body
    # pyephem knows about can be named.
    # planets = mercury, venus, mars, jupiter, saturn

    # 'custom_css' names a stylesheet of your own, 'custom_js' a Javascript file. These load after 'horizon.css' and
    # 'horizon.js', so they will override any definitions. Each file must also be listed in 'copy_once' under
    # [CopyGenerator]. See "Customizing the Horizon skin" in the Customization Guide.
    # custom_css = my-station.css
    # custom_js = my-station.js

    # [[Languages]] lists the languages of the station's pages, for the language
    # picker in the navigation, which appears with two or more entries. 'path' is
    # the directory of a language's pages, relative to the top directory of the
    # station's pages. See "Customizing the Horizon skin" in the Customization
    # Guide for one report per language.
    #
    # [[Languages]]
    #     [[[de]]]
    #         label = Deutsch
    #         path = .
    #     [[[en]]]
    #         label = English
    #         path = en

    # How far back each time span in 'periods' reaches from the newest reading, in seconds or with a suffix
    # such as '27h' or '1y'. The day has 27 hours so that the evening before is in view shortly after midnight.
    [[TimeLengths]]
        day   = 27h
        week  = 7d
        month = 30d
        year  = 1y

    # How the charts look. A subsection is named after a plot group, and its subsections after the series, as
    # under [[JSONFiles]] in [JSONGenerator]. Options set higher up are the defaults of those below, and a
    # chart that is not listed takes the options directly under [[Charts]]. The colors are set in horizon.css.
    # See "Customizing the Horizon skin" in the Customization Guide.
    [[Charts]]

        # How a series is drawn: 'line', 'bar' or 'vector'.
        plot_type = line

        # The y axis, as minimum, maximum and step. None is taken from the readings. A step is the smallest allowed.
        yscale = None, None, None

        # The angle in degrees by which the arrows of a 'vector' chart are turned.
        vector_rotate = 90

        # A series is labelled with the generic label of its type. A 'label' replaces it, translated through [Texts].

        [[[lightning]]]
            plot_type = bar
            [[[[lightning_strike_count]]]]
                label = Lightning (hourly total)

        [[[rain]]]
            plot_type = bar
            [[[[rain]]]]
                label = Rain (hourly total)

        [[[ET]]]
            plot_type = bar
            [[[[ET]]]]
                label = Evapotranspiration (hourly total)

        # The direction of the wind, always over the whole compass.
        [[[winddir]]]
            yscale = 0.0, 360.0, 45.0

        [[[windvec]]]
            plot_type = vector

        [[[UV]]]
            yscale = 0, 16, 1

        [[[rx]]]
            yscale = 0.0, 100.0, 25.0

    [[Forecast]]
        # Whether the browser should fetch the forecast from Open-Meteo.
        # A file 'data/forecast.json' under HTML_ROOT takes precedence.
        browser_fetch = true

        # How many days to ask Open-Meteo for, and how many forecast times, three
        # hours apart, to show for the day that the reader selects.
        days  = 7
        hours = 8


###############################################################################

[CheetahGenerator]

    # Possible encodings include 'html_entities', 'strict_ascii', 'normalized_ascii',
    # as well as those listed in https://docs.python.org/3/library/codecs.html#standard-encodings
    # The pages use 'utf8', because 'html_entities' would also turn a "ü" inside a
    # script into "&#252;", which the browser does not decode inside a script.
    encoding = utf8

    [[SummaryByMonth]]
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl

    [[SummaryByYear]]
        [[[climate_year]]]
            # One climate page for each year.
            template = climate-%Y.html.tmpl
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[statistics]]]
            template = statistics.html.tmpl
        [[[celestial]]]
            template = celestial.html.tmpl
            stale_age = 3600
        [[[telemetry]]]
            template = telemetry.html.tmpl
        [[[reports]]]
            # A page that shows the NOAA reports.
            template = reports.html.tmpl
        [[[climate]]]
            # The climate page of the year in progress.
            template = climate.html.tmpl
        [[[RSS]]]
            template = rss.xml.tmpl
        [[[display_json]]]
            # display.json, which tells the charts how to look.
            template = display.json.tmpl
            # It is static, so it needs to be generated only once
            generate_once = True
        [[[current_json]]]
            # current.json, which the page fetches for the live update. The section
            # [[[current_json]]] must come last in [[ToDate]], because a new time in
            # current.json tells the page that the other pages are written already.
            template = current.json.tmpl


###############################################################################

# The JSONGenerator writes the JSON files that hold the readings for the charts. The
# files hold the data and not how it looks: the labels, the type and the y axis of a
# chart are set under [DisplayOptions]. See "The JSON generator" in the Customization
# Guide, and [JSONGenerator] in the Reference Guide.

[JSONGenerator]

    # Where the JSON files will be put, relative to HTML_ROOT
    json_dest_dir = data

    # Decimal places.
    round = 2

    # Whether to write the times of sunrise and sunset, true or false, so that the
    # charts can shade the nights.
    include_daynight = true

    ###########################################################################

    # The files to write. Each subsection is a family of files, whose name begins the names of the files, e.g.,
    # 'tempdew' for 'tempdew-2026-07-13.json'. It is also the name that 'plot_groups' under [DisplayOptions] refers to.
    # Each subsection of a family is a series, named after its observation type. Options deeper down in the hierarchy
    # override options farther up.

    [[JSONFiles]]

        [[[barometer]]]
            [[[[barometer]]]]

        [[[tempdew]]]
            [[[[outTemp]]]]
            [[[[dewpoint]]]]

        [[[tempfeel]]]
            [[[[windchill]]]]
            [[[[heatindex]]]]
            [[[[appTemp]]]]

        [[[hum]]]
            [[[[outHumidity]]]]

        [[[tempin]]]
            [[[[inTemp]]]]

        [[[humin]]]
            [[[[inHumidity]]]]

        [[[tempext]]]
            [[[[extraTemp1]]]]
            [[[[extraTemp2]]]]
            [[[[extraTemp3]]]]
            [[[[extraTemp4]]]]

        [[[humext]]]
            [[[[extraHumid1]]]]
            [[[[extraHumid2]]]]
            [[[[extraHumid3]]]]
            [[[[extraHumid4]]]]

        [[[templeaf]]]
            [[[[leafTemp1]]]]
            [[[[leafTemp2]]]]

        [[[wetleaf]]]
            [[[[leafWet1]]]]
            [[[[leafWet2]]]]

        [[[tempsoil]]]
            [[[[soilTemp1]]]]
            [[[[soilTemp2]]]]
            [[[[soilTemp3]]]]
            [[[[soilTemp4]]]]

        [[[moistsoil]]]
            [[[[soilMoist1]]]]
            [[[[soilMoist2]]]]
            [[[[soilMoist3]]]]
            [[[[soilMoist4]]]]

        [[[pm]]]
            [[[[pm1_0]]]]
            [[[[pm2_5]]]]
            [[[[pm10_0]]]]

        [[[lightning]]]
            # Total over each hour.
            aggregate_type = sum
            aggregate_interval = 1h
            [[[[lightning_strike_count]]]]

        [[[rain]]]
            # Total over each hour.
            aggregate_type = sum
            aggregate_interval = 1h
            [[[[rain]]]]

        [[[wind]]]
            [[[[windSpeed]]]]
            [[[[windGust]]]]

        [[[winddir]]]
            [[[[windDir]]]]

        [[[windvec]]]
            [[[[windvec]]]]

        [[[radiation]]]
            [[[[radiation]]]]
            [[[[maxSolarRad]]]]

        [[[UV]]]
            [[[[UV]]]]

        [[[rx]]]
            [[[[rxCheckPercent]]]]

        [[[volt]]]
            [[[[consBatteryVoltage]]]]
            [[[[heatingVoltage]]]]
            [[[[supplyVoltage]]]]
            [[[[referenceVoltage]]]]

        [[[ET]]]
            aggregate_type = sum
            aggregate_interval = 1h
            [[[[ET]]]]

    # The whole archive, as files the browser fetches when a chart needs them. The
    # charts can go back to any date in the archive.
    [[Archive]]

        # One file per calendar year. The last 'years' years get
        # 'year_resolution', older years 'old_year_resolution'.
        years = 2
        year_resolution = 1h
        old_year_resolution = 4h

        # One file per calendar month, for this many months back, at a finer
        # resolution than the year files. The resolution is in seconds or with a
        # duration suffix: 900 or '15M'. A lower-case 'm' means months, not
        # minutes.
        months = 2
        month_resolution = 900

        # One file per day, for this many days back. The charts of the most
        # recent days are drawn from these files. Older day files are removed.
        # A 'day_resolution' of 0 means the archive interval of the day's records.
        days = 30
        day_resolution = 0

        # How many seconds a report may spend writing archive files. The next
        # report writes what is left. The day files are always written. 0 removes
        # the limit.
        budget = 30

        # Types whose files also carry the lowest and highest value of each
        # aggregation interval, not only the average, because an average hides the
        # peaks of a type such as windGust, or the UV index at noon.
        extremes = windGust, windSpeed, rainRate, UV

        # How often to write every archive file again from the whole database,
        # rather than only extending it. 0 means never. Set 'rebuild' to '1d' if
        # archive records in your database are ever edited.
        rebuild = 0


###############################################################################

[CopyGenerator]

    # List of files to be copied only the first time the generator runs
    copy_once = horizon.css, weewx-json.js, horizon.js, climate.js, echarts.min.js, favicon.ico, LICENSE-ECharts.txt, forecast.js, icons/*, icons/forecast/*, moon/*


###############################################################################

[Units]
    [[TimeFormats]]
        # WeeWX's defaults take the time from the locale, and the locale's time
        # always has seconds, e.g., "23:00:00". No format can drop them and still
        # follow the locale, so the formats below are set here instead: to the
        # minute, on a 24-hour clock. A language file overrides them, as en.conf
        # does for the twelve-hour clock.
        ephem_day  = "%H:%M"
        ephem_year = "%d %b %H:%M"
        # The formats for the time of a high or a low, one for each time span.
        # The week adds the weekday, and the month and the year add the date.
        day        = "%H:%M"
        week       = "%H:%M, %A"
        month      = "%d %b, %H:%M"
        year       = "%d %b %Y, %H:%M"


###############################################################################

[Generators]
    # The list of generators that are to be run:
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.jsongenerator.JSONGenerator, weewx.reportengine.CopyGenerator
