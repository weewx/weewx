SKIN_NAME = Horizon
SKIN_VERSION = 5.5.0

###############################################################################

[Extras]

    # If you have a Google Analytics GA4 tag, uncomment and edit the next line.
    #googleAnalyticsId = G-ABCDEFGHI


###############################################################################

[DisplayOptions]

    # Show link to NOAA-style summary reports?
    show_reports = True

    # Show the climate page: the counted days, the year's shape, and the record
    # year by year. It costs one query per figure per month, against the daily
    # summaries, so a station with a long record may want it off.
    show_climate = True

    # Show a link to the RSS feed?
    show_rss = True

    # Which types appear in the RSS feed.
    observations_rss = outTemp, inTemp, barometer, windSpeed, rain, rainRate, windchill, heatindex, dewpoint, outHumidity, inHumidity

    # Which plots appear on the telemetry page.
    telemetry_plot_groups = rx, volt

    # Link to the server-rendered PNG beside each chart. Left out, the links
    # appear whenever the ImageGenerator is in [Generators].
    #
    # show_image_links = True

    # How often the page checks for a new record, in seconds. 0 disables live
    # updating. There is no point going below your archive interval.
    refresh_interval = 60

    # Which types appear in "current conditions", and in what order.
    observations_current = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, UV, radiation, lightning_strike_count, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, pm1_0, pm2_5, pm10_0

    # The card of current conditions: which reading is set large at the top, and
    # which rows follow underneath. Anything your station does not record is
    # skipped, so a list may safely name more than you have.
    #
    # dashboard_lead = outTemp
    # dashboard_readings = dewpoint, outHumidity, barometer, windSpeed, UV, radiation, rain

    # Which types are shown large, at the top of the page. Keep this short --
    # three or four is about right on a phone.
    observations_headline = outTemp, windSpeed, rain, barometer

    # Which types appear in the statistics section, and in what order.
    observations_stats = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, ET, hail, hailRate, snow, UV, radiation, lightning_strike_count, lightning_distance, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, extraTemp3, extraHumid3, extraTemp4, extraHumid4, leafTemp1, leafTemp2, leafWet1, leafWet2, soilTemp1, soilTemp2, soilTemp3, soilTemp4, soilMoist1, soilMoist2, soilMoist3, soilMoist4, pm1_0, pm2_5, pm10_0, co, co2, nh3, no2, o3, so2

    # Some observations display a sum rather than min/max values
    obs_type_sum = rain, ET, hail, snow, lightning_strike_count

    # Some observations display only the max value
    obs_type_max = rainRate, hailRate, snowRate, UV

    # Sensor status fields, shown on the sensors panel.
    sensor_connections = rxCheckPercent, signal1, signal2, signal3, signal4, signal5, signal6, signal7, signal8
    sensor_batteries = outTempBatteryStatus, inTempBatteryStatus, rainBatteryStatus, hailBatteryStatus, snowBatteryStatus, windBatteryStatus, uvBatteryStatus, txBatteryStatus, batteryStatus1, batteryStatus2, batteryStatus3, batteryStatus4, batteryStatus5, batteryStatus6, batteryStatus7, batteryStatus8
    sensor_voltages = consBatteryVoltage, heatingVoltage, supplyVoltage, referenceVoltage

    # Which plots to show, and in what order. The names refer to plots defined
    # in [JSONGenerator] below, without the time span prefix: 'wind' covers
    # 'daywind', 'weekwind', 'monthwind' and 'yearwind'.
    plot_groups = tempdew, tempfeel, hum, barometer, wind, winddir, windvec, rain, radiation, UV, ET, lightning, tempin, humin, tempext, humext, templeaf, wetleaf, tempsoil, moistsoil, pm

    # The time spans offered by the period switcher. How long each one covers is
    # NOT set here. It comes from 'time_length' in the matching [[*_images]]
    # section below, so that the charts and the PNGs show the same span.
    periods = day, week, month, year

    # Which side the panels sit on when there is room for two columns.
    # Either 'right' or 'left'.
    sidebar = right

    # And where they go when there is not. Either 'top', above the charts, or
    # 'bottom', below them.
    sidebar_responsive = top

    # The page is two columns of panels. Each name is an .inc file in the skin
    # directory: to add your own, drop in 'myPanel.inc' and put 'myPanel' in one
    # of these lists. No template editing needed.
    #
    # The wide column. 'history' is the charts and their span switcher, 'hilo' the
    # statistics table. Only one 'history' belongs on a page.
    main_panels = history, hilo

    # And the narrower one beside it.
    panels = current, forecast, sunmoon, planets, imagery, sensors, about
    #
    # "sunmoon" is the sun and the moon in one panel; name "sun" and "moon"
    # instead for one each. "planets" needs pyephem, like the other two.
    #
    # Which planets, and in what order. Any body pyephem knows can be named.
    # planets = mercury, venus, mars, jupiter, saturn


    # A stylesheet of your own, loaded after horizon.css, and a script, loaded
    # after horizon.js. Put the file in the skin directory and add it to
    # 'copy_once' in [CopyGenerator], or it will not be installed.
    #
    # custom_css = my-station.css
    # custom_js  = my-station.js
    #
    # 'flavor-deck.css' and 'flavor-deck.js' ship with the skin and give it a
    # second look: flatter, denser, with the navigation in a column. Comment
    # them out for the skin's own appearance.
    custom_css = flavor-deck.css
    custom_js  = flavor-deck.js

    # The look of the skin. horizon.css defines it as custom properties, and any
    # name set here overrides the one in the file. Whatever you write is emitted
    # as '--name', so restyling the skin is a change to this file rather than to
    # the CSS. [[[Light]]] applies everywhere; [[[Dark]]] overrides it where the
    # reader has asked for a dark page.
    #
    # The names are listed in "Customizing the Horizon skin" in the
    # Customization Guide.
    #
    # [[Theme]]
    #     [[[Light]]]
    #         bg      = "#f4f7f9"
    #         surface = "#ffffff"
    #         ink     = "#16222e"
    #         accent  = "#2c6d9e"
    #         radius  = 10px
    #         font    = system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    #
    #     [[[Dark]]]
    #         bg      = "#0e161f"
    #         surface = "#16222e"
    #         accent  = "#6fa9d6"

    # A language switcher, shown only if there is more than one entry below.
    #
    # WeeWX renders each page in a single language, so this cannot translate the page
    # in the browser. It links to a copy of the page rendered in that language. To
    # use it, run the report once per language in weewx.conf, each with its own lang
    # and HTML_ROOT, then list them here with the path from one to the other:
    #
    #     [[HorizonReport]]
    #         skin = Horizon
    #         lang = de
    #     [[HorizonReportEN]]
    #         skin = Horizon
    #         lang = en
    #         HTML_ROOT = public_html/en
    #         [[[DisplayOptions]]]
    #             # how this rendering gets back to the top directory
    #             lang_root = ..
    #
    # The paths below are relative to the station's top directory; 'lang_root' above
    # tells a page in a subdirectory how to get back up to it.
    #
    # [[Languages]]
    #     [[[de]]]
    #         label = Deutsch
    #         path = .
    #     [[[en]]]
    #         label = English
    #         path = en


###############################################################################

    [[Forecast]]
        # Where the forecast comes from.
        #
        # The page reads 'data/forecast.json' first. Anything can write it: the
        # example script 'forecast-fetch.py' in this directory, weewx-dwd,
        # weewx-forecast, a cron job of your own. Nothing then leaves the
        # station, and the model is fetched once rather than once per visitor.
        #
        # Without that file the page asks Open-Meteo itself. No key is needed
        # and it works anywhere, but each reader's browser talks to Open-Meteo
        # directly, so their address reaches a third party. On a station
        # published to the world, consider writing the file instead.
        browser_fetch = true

        # Whether anything on this station writes 'data/forecast.json'. Left
        # false the page does not ask for it, which keeps a 404 out of every
        # reader's console; set it true once something does write the file, and
        # it takes precedence over the fetch above.
        file = false

        # How many days, and how many of the hours ahead. The hours are shown
        # every third one.
        days  = 7
        hours = 8



[CheetahGenerator]

    # UTF-8 rather than html_entities. Every page here declares <meta charset="UTF-8">,
    # so entities gain nothing, and they break the JavaScript. The encoder runs over
    # the finished document and turns an "ü" inside a script string into "&#252;",
    # which no browser decodes there. The NOAA reports below keep their own encoding.
    encoding = utf8

    [[SummaryByMonth]]
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl

    [[SummaryByYear]]
        [[[climate_year]]]
            # One page per year that has ended. WeeWX writes a summary page only
            # while its period is running, so each of these is rendered once.
            template = climate/climate-%Y.html.tmpl
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[statistics]]]
            template = statistics.html.tmpl
        [[[celestial]]]
            template = celestial.html.tmpl
            stale_age = 3600
        [[[telemetry]]]
            template = telemetry.html.tmpl
        [[[reports]]]
            # The NOAA summaries, wrapped in a page with navigation.
            template = reports.html.tmpl
        [[[climate]]]
            # The year in progress, read as climate: the counted days, the year's
            # shape month by month, and the record year by year.
            template = climate.html.tmpl
        [[[RSS]]]
            template = rss.xml.tmpl
        [[[current_json]]]
            # The small payload the page polls for live updates. Keep it last: a
            # changed timestamp in it is what tells the page that the rest has been
            # re-rendered and is worth fetching again.
            template = current.json.tmpl


###############################################################################

# The JSONGenerator writes the time series that the browser plots.

[JSONGenerator]

    # This section controls the JSON files the charts are drawn from, and holds
    # the plot definitions themselves further down. See "The JSON generator" in
    # the Customization Guide, and [JSONGenerator] in the Reference Guide.

    # Subdirectory of HTML_ROOT for the JSON files.
    json_dest_dir = data

    # One file per plot per time span. Off: the archive below covers the same
    # spans and reaches back further.
    periods = false

    # Decimal places.
    round = 3

    # Emit sunrise/sunset times, so the charts can shade the night.
    include_daynight = true

    ###########################################################################

    # What the plots are. The syntax is the ImageGenerator's, so everything
    # documented for that generator applies here, and a plot already written for
    # a PNG can be pasted in unchanged.
    #
    # What a plot IS comes from here. What it LOOKS like in the browser does not:
    # the charts take their colours from [[Theme]] under [DisplayOptions].
    #
    # Reaches both:   time_length, aggregate_type, aggregate_interval,
    #                 data_binding, data_type, unit, label, plot_type,
    #                 color, fill_color, chart_line_colors, chart_fill_colors,
    #                 yscale, y_nticks, x_interval, vector_rotate, rose_label,
    #                 show_daynight, skip_if_empty, stale_age
    # PNGs only:      image_width, image_height, image_background_color,
    #                 chart_background_color, chart_gridline_color, anti_alias,
    #                 every *_font_* option, daynight_*_color, line_type,
    #                 marker_type, marker_size, line_gap_fraction, rose_width,
    #                 rose_height, rose_diameter, rose_line_width,
    #                 bottom_label_format
    #
    # The PNGs are not generated at all unless you put the ImageGenerator back
    # into [Generators]. It reads its plots from [ImageGenerator], so move the
    # definitions there if you want them; this generator looks there too.

    # Rendered at twice the classic 500x180. The extra pixels cost a little disk
    # but make the image sharp on the phone screens most people will open it on,
    # and it still scales down cleanly wherever it is embedded at 500 wide.
    image_width = 1000
    image_height = 360
    image_background_color = "#ffffff"   # the skin's --surface, light theme

    chart_background_color = "#ffffff"
    chart_gridline_color = "#dbe4ec"    # the skin's --border

    # Render larger still, then downsample: this is what removes the jagged
    # edges the old plots were known for.
    anti_alias = 2

    top_label_font_path = font/OpenSans-Bold.ttf
    top_label_font_size = 26

    unit_label_font_path = font/OpenSans-Bold.ttf
    unit_label_font_size = 22
    unit_label_font_color = "#5c7183"   # the skin's --ink-muted

    bottom_label_font_path = font/OpenSans-Regular.ttf
    bottom_label_font_size = 21
    bottom_label_font_color = "#8397a7" # the skin's --ink-faint
    bottom_label_offset = 6

    axis_label_font_path = font/OpenSans-Regular.ttf
    axis_label_font_size = 19
    axis_label_font_color = "#8397a7"   # the skin's --ink-faint

    rose_label = N
    rose_label_font_path = font/OpenSans-Regular.ttf
    rose_label_font_size  = 17
    rose_label_font_color = "#222222"
    # The defaults are sized for a 500x180 image. At twice that they leave a rose
    # half the size it should be, with the label spilling out of it.
    rose_width = 42
    rose_height = 42
    rose_diameter = 20
    rose_line_width = 2

    # Default colors for the plot lines. The JSONGenerator passes these through
    # to the browser, so the charts inherit whatever palette you set here.
    chart_line_colors = "#4282b4", "#b44242", "#42b442", "#42b4b4", "#b442b4"
    chart_fill_colors = "#72b2c4", "#c47272", "#72c472", "#72c4c4", "#c472c4"

    line_type = 'solid'
    marker_size = 14
    marker_type ='none'
    yscale = None, None, None
    vector_rotate = 90
    line_gap_fraction = 0.05

    show_daynight = true
    daynight_day_color   = "#ffffff"
    daynight_night_color = "#eef2f6"    # close to the skin's --chart-night
    daynight_edge_color  = "#eef2f6"
    # Dusk is not a hard edge, so neither is this. Note the gradient is measured
    # in pixels, not minutes: on the day plot 40 px is roughly the half hour of
    # civil twilight, but on the week and month plots the same 40 px covers far
    # more time than dusk really takes. The browser charts do it properly, from
    # the actual twilight times.
    daynight_gradient = 40

    plot_type = line
    width = 3
    aggregate_type = none

    # Do not emit a plot if it has no non-null data:
    skip_if_empty = year

    [[day_images]]
        x_label_format = %H:%M
        bottom_label_format = %x %X
        time_length = 27h
        aggregate_interval = 300

        [[[daybarometer]]]
            [[[[barometer]]]]

        [[[daytempdew]]]
            [[[[outTemp]]]]
            [[[[dewpoint]]]]

        [[[daytempfeel]]]
