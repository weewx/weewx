###############################################################################

SKIN_NAME = Horizon
SKIN_VERSION = 5.5.0

###############################################################################

# Horizon draws its charts in the browser, from the JSON written by the
# JSONGenerator. The plot definitions below are the [ImageGenerator] ones, so a
# plot already written for a PNG is drawn here without any change to it.

[Generators]
    # No ImageGenerator: the charts are drawn in the browser, so the PNGs would be
    # work nobody looks at. Add 'weewx.imagegenerator.ImageGenerator' back if you
    # want the files themselves, and set 'show_image_links' to True to link to them
    # from the charts.
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.jsongenerator.JSONGenerator, weewx.summaryimage.SummaryImageGenerator, weewx.reportengine.CopyGenerator

###############################################################################

[Extras]

    # If you have a Google Analytics GA4 tag, uncomment and edit the next line.
    #googleAnalyticsId = G-ABCDEFGHI


###############################################################################

[DisplayOptions]

    # Show link to NOAA-style summary reports?
    show_reports = True

    # Show the climate page: the counted days, the year's shape, and the record
    # year by year. It costs one query per figure per month, against the daily
    # summaries, so a station with a long record may want it off.
    show_climate = True

    # Show a link to the RSS feed?
    show_rss = True

    # Which types appear in the RSS feed.
    observations_rss = outTemp, inTemp, barometer, windSpeed, rain, rainRate, windchill, heatindex, dewpoint, outHumidity, inHumidity

    # Which plots appear on the telemetry page.
    telemetry_plot_groups = rx, volt

    # Offer a link to the server-rendered PNG next to each chart. Left out, the
    # links appear when the ImageGenerator is in [Generators] and not otherwise.
    # Set it only for a station whose PNGs come from somewhere else.
    #
    # show_image_links = True

    # How often the page asks whether there is a new record, in seconds. Set to 0
    # to disable live updating. There is no point setting this below your archive
    # interval. Nothing new appears until the next record is archived.
    #
    # The poll itself is small: current.json and nothing more. When it does find a
    # new record, the page fetches itself again and puts the freshly rendered
    # panels in place of the ones on screen, so the day's high and low, the times
    # they were reached, the trends, the almanac and the statistics all move on
    # together with the reading. The charts and the imagery are refreshed at the
    # same moment. A page left open all afternoon therefore says the same thing as
    # one loaded just now.
    refresh_interval = 60

    # Which types appear in "current conditions", and in what order.
    observations_current = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, UV, radiation, lightning_strike_count, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, pm1_0, pm2_5, pm10_0

    # The card of current conditions: which reading is set large at the top, and
    # which rows follow underneath. Leave them out and the skin uses the lists
    # below instead. Anything your station does not record is skipped either
    # way, so a list may safely name more than you have.
    #
    # dashboard_lead = outTemp
    # dashboard_readings = dewpoint, outHumidity, barometer, windSpeed, UV, radiation, rain

    # Which types are shown large, at the top of the page. Keep this short --
    # three or four is about right on a phone.
    observations_headline = outTemp, windSpeed, rain, barometer

    # Which types appear in the statistics section, and in what order.
    observations_stats = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, ET, hail, hailRate, snow, UV, radiation, lightning_strike_count, lightning_distance, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, extraTemp3, extraHumid3, extraTemp4, extraHumid4, leafTemp1, leafTemp2, leafWet1, leafWet2, soilTemp1, soilTemp2, soilTemp3, soilTemp4, soilMoist1, soilMoist2, soilMoist3, soilMoist4, pm1_0, pm2_5, pm10_0, co, co2, nh3, no2, o3, so2

    # Some observations display a sum rather than min/max values
    obs_type_sum = rain, ET, hail, snow, lightning_strike_count

    # Some observations display only the max value
    obs_type_max = rainRate, hailRate, snowRate, UV

    # Sensor status fields, shown on the sensors panel.
    sensor_connections = rxCheckPercent, signal1, signal2, signal3, signal4, signal5, signal6, signal7, signal8
    sensor_batteries = outTempBatteryStatus, inTempBatteryStatus, rainBatteryStatus, hailBatteryStatus, snowBatteryStatus, windBatteryStatus, uvBatteryStatus, txBatteryStatus, batteryStatus1, batteryStatus2, batteryStatus3, batteryStatus4, batteryStatus5, batteryStatus6, batteryStatus7, batteryStatus8
    sensor_voltages = consBatteryVoltage, heatingVoltage, supplyVoltage, referenceVoltage

    # Which plots to show, and in what order. The names refer to plots defined
    # in [ImageGenerator] below, without the time span prefix: 'wind' covers
    # 'daywind', 'weekwind', 'monthwind' and 'yearwind'.
    plot_groups = tempdew, tempfeel, hum, barometer, wind, winddir, windvec, rain, radiation, UV, ET, lightning, tempin, humin, tempext, humext, templeaf, wetleaf, tempsoil, moistsoil, pm

    # The time spans offered by the period switcher. How long each one covers is
    # NOT set here. It comes from 'time_length' in the matching [[*_images]]
    # section below, so that the charts and the PNGs show the same span.
    periods = day, week, month, year

    # Which side the panels sit on when there is room for two columns.
    sidebar = right

    # And where they go when there is not: below the charts, or above them.
    sidebar_responsive = top

    # Which panels appear beside the charts, and in what order. Each name is an .inc
    # file in the skin directory: to add your own, drop in 'myPanel.inc' and put
    # 'myPanel' in this list. No template editing needed.
    panels = current, sun, moon, imagery, sensors, about

    # Switching something off, without editing the lists above. Deleting an entry
    # there works too, but then you no longer have it to put back.
    #
    # hide_plot_groups = tempin, humin, templeaf, wetleaf
    # hide_panels = imagery

    # A stylesheet of your own, loaded after horizon.css. For anything the names
    # below do not reach. Put the file in the skin directory and add it to
    # 'copy_once' in [CopyGenerator], or it will not be installed.
    #
    # custom_css = my-station.css

    # The look of the skin. horizon.css defines it as custom properties, and any
    # name set here overrides the one in the file. There is no fixed list: whatever
    # you write below is emitted as '--name'. So restyling the skin is a change to
    # this file, not to the CSS.
    #
    # Names set under [[[Light]]] apply everywhere; [[[Dark]]] overrides them where
    # the reader has asked for a dark page. Leave out what you do not want to change.
    #
    # [[Theme]]
    #     [[[Light]]]
    #         # Surfaces and text
    #         bg           = "#f4f7f9"    # the page behind the cards
    #         surface      = "#ffffff"    # cards, panels
    #         surface-sunk = "#eef3f7"    # table stripes, inset areas
    #         ink          = "#16222e"    # body text
    #         ink-muted    = "#5c7183"    # labels, secondary text
    #         ink-faint    = "#8397a7"    # axis labels, captions
    #         border       = "#dbe4ec"
    #         border-strong = "#c2d0dc"
    #
    #         # Accents
    #         accent        = "#2c6d9e"   # links, active tab
    #         accent-bright = "#4282b4"
    #         hi            = "#b44242"   # highs
    #         lo            = "#4257b4"   # lows
    #         ok            = "#3d8a4e"
    #         warn          = "#b4762c"
    #
    #         # Chart surfaces. horizon.js reads these, so the canvas and the page
    #         # agree. The line colours themselves come from 'chart_line_colors'
    #         # in [ImageGenerator], where the PNGs take them too.
    #         chart-grid  = "#e3eaf1"
    #         chart-axis  = "#8397a7"
    #         chart-night = "#eaeef3"     # the night shading
    #
    #         # Shape and spacing
    #         radius = 10px
    #         gap    = 1rem               # between cards
    #         shadow = "0 1px 2px rgb(22 34 46 / 6%)"
    #
    #         # Type. 'font' is the stack for the whole page; the rest are sizes,
    #         # from the small print to the headline figure.
    #         font     = system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    #         fs-xs    = 0.75rem
    #         fs-sm    = 0.8125rem
    #         fs-base  = 0.9375rem
    #         fs-md    = 1.0625rem
    #         fs-lg    = 1.25rem
    #         fs-xl    = 2rem
    #         fs-huge  = 3rem
    #
    #     [[[Dark]]]
    #         bg      = "#0e161f"
    #         surface = "#16222e"
    #         accent  = "#6fa9d6"

    # A language switcher, shown only if there is more than one entry below.
    #
    # WeeWX renders each page in a single language, so this cannot translate the page
    # in the browser. It links to a copy of the page rendered in that language. To
    # use it, run the report once per language in weewx.conf, each with its own lang
    # and HTML_ROOT, then list them here with the path from one to the other:
    #
    #     [[HorizonReport]]
    #         skin = Horizon
    #         lang = de
    #     [[HorizonReportEN]]
    #         skin = Horizon
    #         lang = en
    #         HTML_ROOT = public_html/en
    #         [[[DisplayOptions]]]
    #             # how this rendering gets back to the top directory
    #             lang_root = ..
    #
    # The paths below are relative to the station's top directory; 'lang_root' above
    # tells a page in a subdirectory how to get back up to it.
    #
    # [[Languages]]
    #     [[[de]]]
    #         label = Deutsch
    #         path = .
    #     [[[en]]]
    #         label = English
    #         path = en


###############################################################################

[CheetahGenerator]

    # UTF-8 rather than html_entities. Every page here declares <meta charset="UTF-8">,
    # so entities gain nothing, and they break the JavaScript. The encoder runs over
    # the finished document and turns an "ü" inside a script string into "&#252;",
    # which no browser decodes there. The NOAA reports below keep their own encoding.
    encoding = utf8

    [[SummaryByMonth]]
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl

    [[SummaryByYear]]
        [[[climate_year]]]
            # One page per year that has ended. WeeWX writes a summary page only
            # while its period is running, so each of these is rendered once.
            template = climate/climate-%Y.html.tmpl
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[statistics]]]
            template = statistics.html.tmpl
        [[[celestial]]]
            template = celestial.html.tmpl
            stale_age = 3600
        [[[telemetry]]]
            template = telemetry.html.tmpl
        [[[reports]]]
            # The NOAA summaries, wrapped in a page with navigation.
            template = reports.html.tmpl
        [[[climate]]]
            # The year in progress, read as climate: the counted days, the year's
            # shape month by month, and the record year by year.
            template = climate.html.tmpl
        [[[RSS]]]
            template = rss.xml.tmpl
        [[[current_json]]]
            # The small payload the page polls for live updates. Keep it last: a
            # changed timestamp in it is what tells the page that the rest has been
            # re-rendered and is worth fetching again.
            template = current.json.tmpl


###############################################################################

# The JSONGenerator writes the time series that the browser plots.

[JSONGenerator]

    # Which section holds the plot definitions. Pointing at [ImageGenerator] makes
    # every plot already defined for a PNG, including any added by hand, available
    # as JSON with no further configuration.
    source = ImageGenerator

    # Subdirectory of HTML_ROOT for the JSON files.
    json_dest_dir = data

    # Decimal places. Three is plenty for weather data and keeps files small.
    round = 3

    # Emit sunrise/sunset transitions so the charts can shade the night.
    include_daynight = true

    # The four files above all end at the last reading, so none of them can answer
    # "show me last March". The archive writes the whole database instead, one file
    # per plot group and calendar year, with the readings evenly spaced in time. Any
    # span of the record can then be shown. Because the spacing is even, a file holds
    # the first timestamp and the interval rather than a timestamp per reading.
    [[Archive]]
        enable = true

        # Resolution of the archive grid. One hour over several years stays small and
        # is fine down to a day's detail; drop to 30m or 15m for a sharper zoom at the
        # cost of a proportionally larger file.
        resolution = 1h
        aggregate_type = avg
        # A second, finer grid over the recent past, written per calendar month. One
        # hour is right across years, but it flattens a single day, and stepping back
        # through days is what the range bar offers. Thirty days at five minutes costs
        # about what one year at one hour costs, and only the months on screen are
        # fetched. Set 'fine_days' to 0 to do without it.
        fine_days = 30
        # In seconds. A suffix works too, but note that 'm' means months: five
        # minutes is '5M' or, as here, 300.
        fine_resolution = 300

        # Which section defines the plot groups, and what to strip off the plot names
        # ('daytempdew' -> 'tempdew').
        source_group = day_images
        strip_prefix = day

        # How far back to go. 0 means the entire record.
        max_days = 0

        dest_dir = data/archive
        round = 2


###############################################################################

# A picture of the current readings, at a fixed URL. WeeWX can draw a time series
# as a PNG but not the current readings, and those are what people paste into a
# forum post or a chat window. A screenshot is out of date at once. This file is
# redrawn every report cycle.

[SummaryImageGenerator]

    enable = true
    filename = current.png

    # Which readings, and in what order. Keep it to what fits: four to six is right.
    observations = outTemp, windSpeed, rain, barometer

    width = 900
    columns = 2

    # Render at this multiple, then downsample. 2 is sharp on a phone screen.
    scale = 2

    # Colours default to the skin's light palette; override to taste.
    background_color = "#ffffff"
    title_color = "#16222e"
    value_color = "#16222e"
    label_color = "#8397a7"
    sub_color = "#55666f"
    rule_color = "#dbe4ec"

###############################################################################

[CopyGenerator]

    copy_once = horizon.css, horizon.js, climate.js, uplot.min.js, uplot.min.css, favicon.ico, LICENSE-uPlot.txt, moon/*


###############################################################################

# The ImageGenerator section. Both generators read it: the ImageGenerator draws
# these plots as PNGs, the JSONGenerator writes the same series as JSON. The
# syntax is unchanged, so everything documented for the ImageGenerator applies.

[ImageGenerator]

    # Read twice over, and this is worth knowing before changing anything here.
    #
    # The JSONGenerator uses this section as its own. It takes the plot
    # definitions, the time spans, the aggregation, the line colours and the y
    # scaling from here, so a chart in the browser shows the same data over the
    # same window as the PNG of the same plot would. Define a plot once and both
    # have it.
    #
    # What it does NOT take is anything about drawing a picture. Fonts, image
    # sizes, background colours, anti-aliasing, marker shapes, the label formats:
    # those reach the PNGs and stop there. Change 'chart_background_color' and
    # the charts stay as they were, because a browser is not drawing a chart on
    # a canvas the size of an image. It uses the page's own colours, which come
    # from [[Theme]] under [DisplayOptions].
    #
    # So: what the plot IS comes from here. What it LOOKS like in the browser
    # does not.
    #
    # Reaches both:   time_length, aggregate_type, aggregate_interval,
    #                 data_binding, data_type, unit, label, plot_type,
    #                 color, fill_color, chart_line_colors, chart_fill_colors,
    #                 yscale, y_nticks, x_interval, vector_rotate, rose_label,
    #                 show_daynight, skip_if_empty, stale_age
    # PNGs only:      image_width, image_height, image_background_color,
    #                 chart_background_color, chart_gridline_color, anti_alias,
    #                 every *_font_* option, daynight_*_color, line_type,
    #                 marker_type, marker_size, line_gap_fraction, rose_width,
    #                 rose_height, rose_diameter, rose_line_width,
    #                 bottom_label_format
    #
    # The PNGs are not generated at all unless you put the ImageGenerator back
    # into [Generators]; the options below then apply to them.

    # Rendered at twice the classic 500x180. The extra pixels cost a little disk
    # but make the image sharp on the phone screens most people will open it on,
    # and it still scales down cleanly wherever it is embedded at 500 wide.
    image_width = 1000
    image_height = 360
    image_background_color = "#ffffff"   # the skin's --surface, light theme

    chart_background_color = "#ffffff"
    chart_gridline_color = "#dbe4ec"    # the skin's --border

    # Render larger still, then downsample: this is what removes the jagged
    # edges the old plots were known for.
    anti_alias = 2

    top_label_font_path = font/OpenSans-Bold.ttf
    top_label_font_size = 26

    unit_label_font_path = font/OpenSans-Bold.ttf
    unit_label_font_size = 22
    unit_label_font_color = "#5c7183"   # the skin's --ink-muted

    bottom_label_font_path = font/OpenSans-Regular.ttf
    bottom_label_font_size = 21
    bottom_label_font_color = "#8397a7" # the skin's --ink-faint
    bottom_label_offset = 6

    axis_label_font_path = font/OpenSans-Regular.ttf
    axis_label_font_size = 19
    axis_label_font_color = "#8397a7"   # the skin's --ink-faint

    rose_label = N
    rose_label_font_path = font/OpenSans-Regular.ttf
    rose_label_font_size  = 17
    rose_label_font_color = "#222222"
    # The defaults are sized for a 500x180 image. At twice that they leave a rose
    # half the size it should be, with the label spilling out of it.
    rose_width = 42
    rose_height = 42
    rose_diameter = 20
    rose_line_width = 2

    # Default colors for the plot lines. The JSONGenerator passes these through
    # to the browser, so the charts inherit whatever palette you set here.
    chart_line_colors = "#4282b4", "#b44242", "#42b442", "#42b4b4", "#b442b4"
    chart_fill_colors = "#72b2c4", "#c47272", "#72c472", "#72c4c4", "#c472c4"

    line_type = 'solid'
    marker_size = 14
    marker_type ='none'
    yscale = None, None, None
    vector_rotate = 90
    line_gap_fraction = 0.05

    show_daynight = true
    daynight_day_color   = "#ffffff"
    daynight_night_color = "#eef2f6"    # close to the skin's --chart-night
    daynight_edge_color  = "#eef2f6"
    # Dusk is not a hard edge, so neither is this. Note the gradient is measured
    # in pixels, not minutes: on the day plot 40 px is roughly the half hour of
    # civil twilight, but on the week and month plots the same 40 px covers far
    # more time than dusk really takes. The browser charts do it properly, from
    # the actual twilight times.
    daynight_gradient = 40

    plot_type = line
    width = 3
    aggregate_type = none

    # Do not emit a plot if it has no non-null data:
    skip_if_empty = year

    [[day_images]]
        x_label_format = %H:%M
        bottom_label_format = %x %X
        time_length = 27h
        aggregate_interval = 300

        [[[daybarometer]]]
            [[[[barometer]]]]

        [[[daytempdew]]]
            [[[[outTemp]]]]
            [[[[dewpoint]]]]

        [[[daytempfeel]]]
            [[[[windchill]]]]
            [[[[heatindex]]]]
            [[[[appTemp]]]]

        [[[dayhum]]]
            [[[[outHumidity]]]]

        [[[daytempin]]]
            [[[[inTemp]]]]

        [[[dayhumin]]]
            [[[[inHumidity]]]]

        [[[daytempext]]]
            [[[[extraTemp1]]]]
            [[[[extraTemp2]]]]
            [[[[extraTemp3]]]]
            [[[[extraTemp4]]]]

        [[[dayhumext]]]
            [[[[extraHumid1]]]]
            [[[[extraHumid2]]]]
            [[[[extraHumid3]]]]
            [[[[extraHumid4]]]]

        [[[daytempleaf]]]
            [[[[leafTemp1]]]]
            [[[[leafTemp2]]]]

        [[[daywetleaf]]]
            [[[[leafWet1]]]]
            [[[[leafWet2]]]]

        [[[daytempsoil]]]
            [[[[soilTemp1]]]]
            [[[[soilTemp2]]]]
            [[[[soilTemp3]]]]
            [[[[soilTemp4]]]]

        [[[daymoistsoil]]]
            [[[[soilMoist1]]]]
            [[[[soilMoist2]]]]
            [[[[soilMoist3]]]]
            [[[[soilMoist4]]]]

        [[[daypm]]]
            [[[[pm1_0]]]]
            [[[[pm2_5]]]]
            [[[[pm10_0]]]]

        [[[daylightning]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 3600
            [[[[lightning_strike_count]]]]
                label = Lightning (hourly total)

        [[[dayrain]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 3600
            [[[[rain]]]]
                label = Rain (hourly total)

        [[[daywind]]]
            [[[[windSpeed]]]]
            [[[[windGust]]]]

        [[[daywinddir]]]
            # Hardwire in the y-axis scale for wind direction
            yscale = 0.0, 360.0, 45.0
            line_type = None
            marker_type = box
            marker_size = 2
            [[[[windDir]]]]

        [[[daywindvec]]]
            [[[[windvec]]]]
                plot_type = vector

        [[[dayradiation]]]
            [[[[radiation]]]]
            [[[[maxSolarRad]]]]

        [[[dayUV]]]
            yscale = 0, 16, 1
            [[[[UV]]]]


        [[[dayrx]]]
            yscale = 0.0, 100.0, 25.0
            [[[[rxCheckPercent]]]]

        [[[dayvolt]]]
            [[[[consBatteryVoltage]]]]
            [[[[heatingVoltage]]]]
            [[[[supplyVoltage]]]]
            [[[[referenceVoltage]]]]

        [[[dayET]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 3600
            [[[[ET]]]]
                label = Evapotranspiration (hourly total)

    [[week_images]]
        x_label_format = %d
        bottom_label_format = %x %X
        time_length = 7d
        aggregate_type = avg
        aggregate_interval = 3600

        [[[weekbarometer]]]
            [[[[barometer]]]]

        [[[weektempdew]]]
            [[[[outTemp]]]]
            [[[[dewpoint]]]]

        [[[weektempfeel]]]
            [[[[windchill]]]]
            [[[[heatindex]]]]
            [[[[appTemp]]]]

        [[[weekhum]]]
            [[[[outHumidity]]]]

        [[[weektempin]]]
            [[[[inTemp]]]]

        [[[weekhumin]]]
            [[[[inHumidity]]]]

        [[[weektempext]]]
            [[[[extraTemp1]]]]
            [[[[extraTemp2]]]]
            [[[[extraTemp3]]]]
            [[[[extraTemp4]]]]

        [[[weekhumext]]]
            [[[[extraHumid1]]]]
            [[[[extraHumid2]]]]
            [[[[extraHumid3]]]]
            [[[[extraHumid4]]]]

        [[[weektempleaf]]]
            [[[[leafTemp1]]]]
            [[[[leafTemp2]]]]

        [[[weekwetleaf]]]
            [[[[leafWet1]]]]
            [[[[leafWet2]]]]

        [[[weektempsoil]]]
            [[[[soilTemp1]]]]
            [[[[soilTemp2]]]]
            [[[[soilTemp3]]]]
            [[[[soilTemp4]]]]

        [[[weekmoistsoil]]]
            [[[[soilMoist1]]]]
            [[[[soilMoist2]]]]
            [[[[soilMoist3]]]]
            [[[[soilMoist4]]]]

        [[[weekpm]]]
            [[[[pm1_0]]]]
            [[[[pm2_5]]]]
            [[[[pm10_0]]]]

        [[[weeklightning]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 6h
            [[[[lightning_strike_count]]]]
                label = Lightning (weekly total)

        [[[weekrain]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 6h
            [[[[rain]]]]
                label = Rain (weekly total)

        [[[weekwind]]]
            [[[[windSpeed]]]]
            [[[[windGust]]]]
                aggregate_type = max

        [[[weekwinddir]]]
            yscale = 0.0, 360.0, 45.0
            line_type = None
            marker_type = box
            marker_size = 2
            [[[[wind]]]]
                aggregate_type = vecdir

        [[[weekwindvec]]]
            [[[[windvec]]]]
                plot_type = vector

        [[[weekradiation]]]
            [[[[radiation]]]]
            [[[[maxSolarRad]]]]

        [[[weekUV]]]
            yscale = 0, 16, 1
            [[[[UV]]]]


        [[[weekrx]]]
            yscale = 0.0, 100.0, 25.0
            [[[[rxCheckPercent]]]]

        [[[weekvolt]]]
            [[[[consBatteryVoltage]]]]
            [[[[heatingVoltage]]]]
            [[[[supplyVoltage]]]]
            [[[[referenceVoltage]]]]

        [[[weekET]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 6h
            [[[[ET]]]]
