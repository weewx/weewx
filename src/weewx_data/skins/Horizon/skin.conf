SKIN_NAME = Horizon
SKIN_VERSION = 5.5.0

###############################################################################

[Extras]

    # The address of a radar picture for the 'imagery' panel, and the address that
    # the picture links to.
    #radar_img = https://example.com/radar.png
    #radar_url = https://example.com/radar.html

    # The same for a satellite picture.
    #satellite_img = https://example.com/satellite.png
    #satellite_url = https://example.com/satellite.html

    # To display a map of the station, enter an API key for Google Maps.
    #google_map_apikey = xxx

    # If you have a Google Analytics GA4 tag, uncomment and edit the next line.
    #googleAnalyticsId = G-ABCDEFGHI


###############################################################################

[DisplayOptions]

    # How often, in seconds, the page asks for current.json to learn whether a new
    # archive record has arrived. 0 turns the live update off.
    refresh_interval = 60

    # Which panels the front page shows, and in what order. Each name is an .inc file in the skin directory.
    # Possibilities are 'current', 'forecast', 'sun', 'moon', 'sunmoon', 'planets', 'imagery', 'sensors', 'history' (the
    # charts) and 'hilo' (the statistics table). See "Customizing the Horizon skin" in the Customization Guide for how
    # to build your own panel.
    panels = current, forecast, sunmoon, planets, imagery, sensors, history, hilo

    # Which types appear in "current conditions", and in what order.
    observations_current = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, UV, radiation, lightning_strike_count, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, pm1_0, pm2_5, pm10_0

    # Which types appear in the statistics table and on the statistics page, and in
    # what order.
    observations_stats = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, ET, hail, hailRate, snow, UV, radiation, lightning_strike_count, lightning_distance, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, extraTemp3, extraHumid3, extraTemp4, extraHumid4, leafTemp1, leafTemp2, leafWet1, leafWet2, soilTemp1, soilTemp2, soilTemp3, soilTemp4, soilMoist1, soilMoist2, soilMoist3, soilMoist4, pm1_0, pm2_5, pm10_0, co, co2, nh3, no2, o3, so2

    # Which types appear in the RSS feed.
    observations_rss = outTemp, inTemp, barometer, windSpeed, rain, rainRate, windchill, heatindex, dewpoint, outHumidity, inHumidity

    # Some observations display a sum rather than min/max values
    obs_type_sum = rain, ET, hail, snow, lightning_strike_count

    # Some observations display only the max value
    obs_type_max = rainRate, hailRate, snowRate, UV

    # Which types of sensor status the sensors panel and the telemetry page show,
    # and in what order.
    sensor_connections = rxCheckPercent, signal1, signal2, signal3, signal4, signal5, signal6, signal7, signal8
    sensor_batteries = outTempBatteryStatus, inTempBatteryStatus, rainBatteryStatus, hailBatteryStatus, snowBatteryStatus, windBatteryStatus, uvBatteryStatus, txBatteryStatus, batteryStatus1, batteryStatus2, batteryStatus3, batteryStatus4, batteryStatus5, batteryStatus6, batteryStatus7, batteryStatus8
    sensor_voltages = consBatteryVoltage, heatingVoltage, supplyVoltage, referenceVoltage

    # Which charts the 'history' panel shows, and in what order. The names refer to the plots defined in the
    # [JSONGenerator] section without any time prefix. For example, the name 'wind' refers to 'daywind', 'weekwind',
    # 'monthwind', and 'yearwind'.
    plot_groups = tempdew, tempfeel, hum, barometer, wind, winddir, windvec, rain, radiation, UV, ET, lightning, tempin, humin, tempext, humext, templeaf, wetleaf, tempsoil, moistsoil, pm

    # The same for the telemetry page.
    telemetry_plot_groups = rx, volt

    # The time spans offered for the charts. The length of each time span comes
    # from 'time_length' in the matching [[*_images]] section below.
    periods = day, week, month, year

    # Which planets the 'planets' panel lists, and in what order. Any body
    # pyephem knows about can be named.
    # planets = mercury, venus, mars, jupiter, saturn

    # 'custom_css' names a stylesheet of your own, 'custom_js' a Javascript file. These load after 'horizon.css' and
    # 'horizon.js', so they will override any definitions. Each file must also be listed in 'copy_once' under
    # [CopyGenerator]. See "Customizing the Horizon skin" in the Customization Guide.
    # custom_css = my-station.css
    # custom_js = my-station.js

    # [[Languages]] lists the languages of the station's pages, for the language
    # picker in the navigation, which appears with two or more entries. 'path' is
    # the directory of a language's pages, relative to the top directory of the
    # station's pages. See "Customizing the Horizon skin" in the Customization
    # Guide for one report per language.
    #
    # [[Languages]]
    #     [[[de]]]
    #         label = Deutsch
    #         path = .
    #     [[[en]]]
    #         label = English
    #         path = en

    [[Forecast]]
        # Whether the browser should fetch the forecast from Open-Meteo.
        # A file 'data/forecast.json' under HTML_ROOT takes precedence.
        browser_fetch = true

        # How many days to ask Open-Meteo for, and how many forecast times, three
        # hours apart, to show for the day that the reader selects.
        days  = 7
        hours = 8


###############################################################################

[CheetahGenerator]

    # Possible encodings include 'html_entities', 'strict_ascii', 'normalized_ascii',
    # as well as those listed in https://docs.python.org/3/library/codecs.html#standard-encodings
    # The pages use 'utf8', because 'html_entities' would also turn a "ü" inside a
    # script into "&#252;", which the browser does not decode inside a script.
    encoding = utf8

    [[SummaryByMonth]]
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl

    [[SummaryByYear]]
        [[[climate_year]]]
            # One climate page for each year.
            template = climate-%Y.html.tmpl
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[statistics]]]
            template = statistics.html.tmpl
        [[[celestial]]]
            template = celestial.html.tmpl
            stale_age = 3600
        [[[telemetry]]]
            template = telemetry.html.tmpl
        [[[reports]]]
            # A page that shows the NOAA reports.
            template = reports.html.tmpl
        [[[climate]]]
            # The climate page of the year in progress.
            template = climate.html.tmpl
        [[[RSS]]]
            template = rss.xml.tmpl
        [[[current_json]]]
            # current.json, which the page fetches for the live update. The section
            # [[[current_json]]] must come last in [[ToDate]], because a new time in
            # current.json tells the page that the other pages are written already.
            template = current.json.tmpl


###############################################################################

# The JSONGenerator writes the JSON files that are used by the charts.
# See "The JSON generator" in the Customization Guide, and [JSONGenerator] in the
# Reference Guide.

[JSONGenerator]

    # Where the JSON files will be put, relative to HTML_ROOT
    json_dest_dir = data

    # Decimal places.
    round = 2

    # Whether to write the times of sunrise and sunset, true or false, so that the
    # charts can shade the nights.
    include_daynight = true

    ###########################################################################

    # The plot definitions follow, in the syntax of [ImageGenerator], so that a
    # plot written for [ImageGenerator] works here unchanged.

    # Default colors for the plot lines. These can be overridden for
    # individual lines using option 'color'.
    chart_line_colors = "#4282b4", "#b44242", "#42b442", "#42b4b4", "#b442b4"
    # Default fill colors for bar charts. These can be overridden for
    # individual bar plots using option 'fill_color'.
    chart_fill_colors = "#72b2c4", "#c47272", "#72c472", "#72c4c4", "#c472c4"

    rose_label = N
    yscale = None, None, None
    vector_rotate = 90
    line_gap_fraction = 0.05

    show_daynight = true

    plot_type = line
    aggregate_type = none

    # Do not generate a plot if it does not have any non-null data:
    skip_if_empty = year

