            [[[[leafTemp1]]]]
            [[[[leafTemp2]]]]

        [[[yearwetleaf]]]
            [[[[leafWet1]]]]
            [[[[leafWet2]]]]

        [[[yeartempsoil]]]
            [[[[soilTemp1]]]]
            [[[[soilTemp2]]]]
            [[[[soilTemp3]]]]
            [[[[soilTemp4]]]]

        [[[yearmoistsoil]]]
            [[[[soilMoist1]]]]
            [[[[soilMoist2]]]]
            [[[[soilMoist3]]]]
            [[[[soilMoist4]]]]

        [[[yearpm]]]
            [[[[pm1_0]]]]
            [[[[pm2_5]]]]
            [[[[pm10_0]]]]

        [[[yearlightning]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 1d
            [[[[lightning_strike_count]]]]
                label = Lightning (daily total)

        [[[yearrain]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 1w
            [[[[rain]]]]
                label = Rain (weekly total)

        [[[yearwind]]]
            [[[[windSpeed]]]]
            [[[[windGust]]]]
                aggregate_type = max

        [[[yearwinddir]]]
            yscale = 0.0, 360.0, 45.0
            line_type = None
            marker_type = box
            marker_size = 2
            [[[[wind]]]]
                aggregate_type = vecdir

        [[[yearwindvec]]]
            [[[[windvec]]]]
                plot_type = vector

        [[[yearradiation]]]
            [[[[radiation]]]]
            [[[[maxSolarRad]]]]

        [[[yearUV]]]
            yscale = 0, 16, 1
            [[[[UV]]]]


        [[[yearrx]]]
            yscale = 0.0, 100.0, 25.0
            [[[[rxCheckPercent]]]]

        [[[yearvolt]]]
            [[[[consBatteryVoltage]]]]
            [[[[heatingVoltage]]]]
            [[[[supplyVoltage]]]]
            [[[[referenceVoltage]]]]

        [[[yearET]]]
            plot_type = bar
            aggregate_type = sum
            aggregate_interval = 1d
            [[[[ET]]]]
                label = Evapotranspiration (daily total)

    # The whole record, cut into files a page fetches one at a time. This is what
    # lets the charts show any span, rather than only the last day, week, month
    # and year.
    [[Archive]]
        enable = true

        # How readings are combined into a slot.
        aggregate_type = avg

        # One file per calendar year, on this grid, for this many years back.
        resolution = 1h
        recent_years = 2

        # The years before that, on a coarser grid. Set it equal to 'resolution'
        # to keep one grid for every year.
        coarse_resolution = 4h

        # One file per calendar month, on a closer grid, for this many months
        # back. This is what a single day on screen is drawn from.
        fine_months = 2
        # In seconds. A duration suffix works too, but note that 'm' means
        # months: fifteen minutes is '15M', or 900 as here.
        fine_resolution = 900

        # One file per day at the station's own archive interval, for this many
        # days back. This is what the day view is drawn from. Older files are
        # removed, so this tier does not grow.
        raw_days = 30
        # 0 means the archive interval, whatever the hardware turned out to use.
        raw_resolution = 0

        # How many seconds a report may spend on the archive. A report that runs
        # out writes what it has worked out, and the next one carries on from
        # there. The day view is never deferred. 0 does the lot in one run.
        budget = 30

        # Types that also carry their lowest and highest reading in each slot.
        # An average turns a gust into a breeze. Each name costs two more
        # queries per slot.
        extremes = windGust, windSpeed, rainRate, radiation, UV

        # How often to build every file from the whole database again, rather
        # than carrying it forward. 0 never does. Set it to '1d' if readings in
        # your database are ever edited in place.
        rebuild = 0

        # Which subsection of the plot definitions to take the groups from, and
        # what to strip off the plot names ('daytempdew' -> 'tempdew').
        source_group = day_images
        strip_prefix = day

        # How far back to go. 0 means the entire record.
        max_days = 0

        dest_dir = data/archive
        round = 2


###############################################################################


###############################################################################

[CopyGenerator]

    copy_once = horizon.css, horizon.js, climate.js, echarts.min.js, favicon.ico, LICENSE-ECharts.txt, flavor-deck.css, flavor-deck.js, forecast.js, icons/*, icons/forecast/*, moon/*


[Units]
    [[TimeFormats]]
        # The defaults carry seconds, which nobody needs for a sunrise. A language
        # file can override these; en.conf does, for the twelve-hour clock.
        ephem_day  = %H:%M
        ephem_year = %d %b %H:%M
        # Nor for the moment a maximum was reached: WeeWX asks the locale for these
        # and gets "23:00:00" where "23:00" says the same. Each span carries only
        # what tells it apart from the others -- a time within a day, a weekday
        # within a week, a date beyond that.
        day        = %H:%M
        week       = "%H:%M, %A"
        month      = "%d %b, %H:%M"
        year       = "%d %b %Y, %H:%M"


###############################################################################

[Generators]
    # The list of generators that are to be run. Horizon draws its charts in the
    # browser from the JSON the JSONGenerator writes, so there is no
    # ImageGenerator here: the PNGs would be work nobody looks at. Add
    # 'weewx.imagegenerator.ImageGenerator' back if you want the files
    # themselves, and set 'show_image_links' to True to link to them.
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.jsongenerator.JSONGenerator, weewx.reportengine.CopyGenerator
