# Generally want a metric system for the Dutch language:
unit_system = metricwx

[Units]

    [[Labels]]

        # These are singular, plural
        meter             = " meter",   " meters"
        day               = " dag",     " dagen"
        hour              = " uur",     " uren"
        minute            = " minuut",  " minuten"
        second            = " seconde", " seconden"

    [[Ordinates]]

        # Ordinal directions. The last one should be for no wind direction
