<!doctype html>
<!--
  An animated, interactive model of the weewxd core: how LOOP packets and archive
  records travel from the driver through StdEngine's services into the database,
  the RESTful uploaders and the report thread.

  It is a simulation written in JavaScript, not a view of a running weewxd. The
  event order, callback bindings and fallbacks follow the code in src/weewx/engine.py
  and its neighbours. Values, formulas and file counts are simplified. Open it
  directly in a browser; it needs nothing else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeeWX core data flow</title>
<style>
  :root {
    --bg: #070b14; --bg2: #0c1322; --panel: #0f172a; --line: #1e293b; --line2: #334155;
    --txt: #e2e8f0; --mute: #94a3b8; --dim: #64748b;
    --STARTUP: #a78bfa; --PRE_LOOP: #60a5fa; --NEW_LOOP_PACKET: #22d3ee; --CHECK_LOOP: #facc15;
    --END_ARCHIVE_PERIOD: #fb923c; --POST_LOOP: #f472b6; --NEW_ARCHIVE_RECORD: #4ade80; --SHUTDOWN: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  code, .mono { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, monospace; }
  #app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px;
    background: linear-gradient(90deg, #0b1220, #111a2e 60%, #0b1220); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 8px 0 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
  header h1 span { background: linear-gradient(90deg, #22d3ee, #a78bfa 50%, #4ade80);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  .sep { width: 1px; height: 24px; background: var(--line2); }
  button, select { background: #131d33; color: var(--txt); border: 1px solid var(--line2); border-radius: 7px;
    padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled), select:hover { border-color: #22d3ee; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #0e7490; border-color: #22d3ee; min-width: 92px; }
  button.warn { border-color: #b45309; }
  button.danger { border-color: #b91c1c; }
  button.on { background: #7f1d1d; border-color: #f87171; }
  button.pulse { animation: pulse 1.2s infinite; border-color: #facc15; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px #facc1544; } }
  label { color: var(--mute); display: flex; gap: 5px; align-items: center; white-space: nowrap; }
  input[type=range] { width: 110px; accent-color: #22d3ee; }
  input[type=checkbox] { accent-color: #22d3ee; }
  #speedVal { width: 38px; color: var(--txt); }
  #narr { padding: 6px 14px; border-bottom: 1px solid var(--line); background: #0a1020; color: #cbd5e1;
    min-height: 32px; display: flex; gap: 10px; align-items: center; }
  #narr .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  #narrText code { color: #f8fafc; background: #1e293b; padding: 0 4px; border-radius: 4px; }
  #confBadge { margin-left: auto; color: #facc15; display: none; white-space: nowrap; }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: auto; }
  svg#svg { display: block; width: 100%; height: 100%; min-width: 980px; }
  aside { border-left: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  aside section { border-bottom: 1px solid var(--line); padding: 8px 12px; }
  aside h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); font-weight: 600; }
  #stack { font: 12px/1.5 ui-monospace, monospace; min-height: 96px; }
  #stack div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stack div:last-child { color: #f8fafc; }
  #threads { font: 12px/1.55 ui-monospace, monospace; }
  #threads .row { display: flex; gap: 8px; align-items: center; }
  #threads .dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; flex: none; }
  #threads .name { width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #threads .st { color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info { flex: 0 0 auto; max-height: 40%; overflow: auto; }
  #info h3 { margin: 0 0 4px; font-size: 14px; }
  #info .file { color: #22d3ee; font: 11.5px ui-monospace, monospace; margin-bottom: 6px; }
  #info p { margin: 4px 0; color: #cbd5e1; }
  #info ul { margin: 4px 0; padding-left: 18px; color: #cbd5e1; }
  #info code { color: #f8fafc; background: #1e293b; padding: 0 4px; border-radius: 4px; font-size: 12px; }
  #info .evs { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
  #info .ev { font: 10.5px ui-monospace, monospace; padding: 1px 6px; border-radius: 99px; border: 1px solid; }
  #logwrap { flex: 1; min-height: 120px; display: flex; flex-direction: column; padding-bottom: 0; }
  #log { flex: 1; min-height: 0; overflow: auto; font: 11.2px/1.45 ui-monospace, monospace; color: #a5b4c8; padding-bottom: 8px; }
  #log div { white-space: pre-wrap; word-break: break-all; }
  #log .DEBUG { color: #64748b; } #log .INFO { color: #a5b4c8; } #log .WARNING { color: #fbbf24; }
  #log .ERROR { color: #f87171; } #log .CRITICAL { color: #fff; background: #7f1d1d55; } #log .OUT { color: #67e8f9; }
  #log .ts { color: #475569; }
  /* SVG */
  .box { fill: #0d1526; stroke: #1f2a40; stroke-width: 1.2; }
  .box.hot { stroke: #22d3ee; }
  .ttl { fill: #e2e8f0; font-size: 13px; font-weight: 650; }
  .sub { fill: #94a3b8; font-size: 11px; }
  .tiny { fill: #64748b; font-size: 10px; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .clk { cursor: pointer; }
  .clk:hover > .box, .clk:hover > rect.pill { stroke: #e2e8f0; }
  .conn { fill: none; stroke: #1e293b; stroke-width: 2; }
  .conn.lit { stroke: #475569; }
  rect.pill { fill: #111b2f; stroke: #2a3954; stroke-width: 1.2; transition: fill .15s, stroke .15s; }
  .pilltxt { fill: #e2e8f0; font-size: 12px; font-family: ui-monospace, Menlo, monospace; pointer-events: none; }
  g.off { opacity: .32; }
  g.unloaded { opacity: .08; }
  .row-hl { transition: fill .25s; }
  .glow { filter: url(#glow); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span>WeeWX</span> · Core data flow</h1>
    <div class="ctl">
      <button id="btnPlay" class="primary" title="Space">⏸ Pause</button>
      <label title="Key S"><input type="checkbox" id="chkStep"> Single step</label>
      <button id="btnNext" disabled title="Key N">Next ⏭</button>
      <label>Speed <input type="range" id="speed" min="-2" max="3" step="0.25" value="0.5"><span id="speedVal" class="mono">1.4×</span></label>
    </div>
    <div class="sep"></div>
    <div class="ctl">
      <button id="btnOutlier" class="warn" title="The next LOOP packet contains outTemp = 300 °F">Send outlier</button>
      <button id="btnIOErr" class="danger" title="genLoopPackets() raises WeeWxIOError on the next packet">Driver error</button>
      <button id="btnNet" title="All HTTP uploads fail">Disconnect internet</button>
      <button id="btnRestart" title="SIGTERM → Terminate → systemd restarts weewxd">systemctl restart</button>
    </div>
    <div class="sep"></div>
    <div class="ctl">
      <label>station_type <select id="selStation"><option value="Simulator">Simulator</option><option value="Vantage">Vantage</option></select></label>
      <label>target_unit <select id="selUnit"><option value="1">US</option><option value="17">METRICWX</option><option value="16">METRIC</option></select></label>
      <label title="[StdCalibrate] [[Corrections]] outTemp = outTemp - 0.5"><input type="checkbox" id="chkCalib" checked> Correction</label>
      <label title="[[Wunderground]] rapidfire = True"><input type="checkbox" id="chkRF"> WU rapidfire</label>
      <label title="log_events = True: log every event"><input type="checkbox" id="chkLogEv"> log_events</label>
    </div>
  </header>
  <div id="narr"><span class="tag" id="narrTag">—</span><span id="narrText">Starting …</span><span id="confBadge">⚠ weewx.conf changed · takes effect after <b>systemctl restart</b></span></div>
  <main>
    <div id="stage"><svg id="svg" viewBox="0 0 1500 960" preserveAspectRatio="xMidYMin meet"></svg></div>
    <aside>
      <section><h2>Call-Stack · MainThread</h2><div id="stack"></div></section>
      <section><h2>Threads</h2><div id="threads"></div></section>
      <section id="info"></section>
      <section id="logwrap"><h2>Log (syslog) · stdout</h2><div id="log"></div></section>
    </aside>
  </main>
</div>
<script>
'use strict';
// =====================================================================================
//  Animation clock. Everything runs on anim (ms), so pause and speed apply everywhere.
// =====================================================================================
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const svg = $('#svg');
let anim = 0, lastFrame = performance.now(), paused = false, speed = 1.4;
let timers = [], tweens = [], frameHooks = [];
class Abort extends Error {}
function rafLoop(now) {
  const dt = Math.min(64, now - lastFrame); lastFrame = now;
  if (!paused) anim += dt * speed;
  if (timers.length) {
    const due = timers.filter(t => t.at <= anim);
    if (due.length) { timers = timers.filter(t => t.at > anim); due.forEach(t => t.res()); }
  }
  for (const tw of tweens.slice()) {
    const p = Math.min(1, (anim - tw.start) / tw.ms);
    tw.fn(p);
    if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.res(); }
  }
  for (const h of frameHooks) h(now);
  requestAnimationFrame(rafLoop);
}
const sleep = ms => new Promise((res, rej) => timers.push({ at: anim + ms, res, rej }));
const tween = (ms, fn) => new Promise((res, rej) => {
  if (ms <= 0) { fn(1); res(); return; }
  tweens.push({ start: anim, ms, fn, res, rej });
});
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// Single step: the MainThread stops before every callback.
let stepMode = false, gateRes = null, gateRej = null;
function gate(label) {
  if (!stepMode) return Promise.resolve();
  $('#btnNext').disabled = false;
  narrate('Single step', `Next: <code>${label}</code>  (key N)`, '#facc15');
  return new Promise((res, rej) => { gateRes = res; gateRej = rej; })
    .finally(() => { $('#btnNext').disabled = true; });
}
function releaseGate() { if (gateRes) { const r = gateRes; gateRes = gateRej = null; r(); } }
function abortAll() {
  const t = timers, w = tweens; timers = []; tweens = [];
  t.forEach(x => x.rej(new Abort())); w.forEach(x => x.rej(new Abort()));
  if (gateRej) { const r = gateRej; gateRes = gateRej = null; r(new Abort()); }
}

// =====================================================================================
//  Constants and units
// =====================================================================================
const EV = ['STARTUP', 'PRE_LOOP', 'NEW_LOOP_PACKET', 'CHECK_LOOP', 'END_ARCHIVE_PERIOD', 'POST_LOOP', 'NEW_ARCHIVE_RECORD', 'SHUTDOWN'];
const EVC = Object.fromEntries(EV.map(e => [e, getComputedStyle(document.documentElement).getPropertyValue('--' + e).trim()]));
// The version weewxd reports in the simulated log.
const WEEWX_VERSION = '5.5.2';
const LOOP_INT = 5, ARCH_INT = 60, ARCH_DELAY = 15, ALT_FT = 700, RETRY_WAIT = 60;
const US = 1, METRIC = 16, METRICWX = 17, UNAME = { 1: 'US', 16: 'METRIC', 17: 'METRICWX' };
const GRP = { outTemp: 'T', inTemp: 'T', dewpoint: 'T', windchill: 'T', heatindex: 'T', appTemp: 'T',
  barometer: 'P', pressure: 'P', altimeter: 'P', windSpeed: 'S', windGust: 'S', rain: 'R', ET: 'R',
  rainRate: 'RR', cloudbase: 'ALT', windrun: 'DIST', outHumidity: '%', windDir: '°', radiation: 'W',
  consBatteryVoltage: 'V', interval: 'min' };
const ULBL = { T: { 1: '°F', 16: '°C', 17: '°C' }, P: { 1: 'inHg', 16: 'mbar', 17: 'mbar' },
  S: { 1: 'mph', 16: 'km/h', 17: 'm/s' }, R: { 1: 'in', 16: 'cm', 17: 'mm' }, RR: { 1: 'in/h', 16: 'cm/h', 17: 'mm/h' },
  ALT: { 1: 'ft', 16: 'm', 17: 'm' }, DIST: { 1: 'mi', 16: 'km', 17: 'km' } };
const FACT = { P: { 16: 33.8639, 17: 33.8639 }, S: { 16: 1.609344, 17: 0.44704 }, R: { 16: 2.54, 17: 25.4 },
  RR: { 16: 2.54, 17: 25.4 }, ALT: { 16: 0.3048, 17: 0.3048 }, DIST: { 16: 1.609344, 17: 1.609344 } };
function toUS(v, g, u) { if (v == null || u === US) return v; if (g === 'T') return v * 1.8 + 32; return FACT[g] ? v / FACT[g][u] : v; }
function fromUS(v, g, u) { if (v == null || u === US) return v; if (g === 'T') return (v - 32) / 1.8; return FACT[g] ? v * FACT[g][u] : v; }
function convertDict(rec, to) {
  const out = {};
  for (const k in rec) out[k] = (k === 'dateTime' || k === 'usUnits') ? rec[k] : fromUS(toUS(rec[k], GRP[k], rec.usUnits), GRP[k], to);
  out.usUnits = to; return out;
}
function unitOf(k, u) { const g = GRP[k]; if (!g) return ''; return ULBL[g] ? ULBL[g][u] : (g === 'min' ? 'min' : g); }
function decOf(k, u) {
  const g = GRP[k];
  return ({ T: 1, S: 1, ALT: 0, DIST: 2, '%': 0, '°': 0, W: 0, V: 2, min: 0 })[g] ??
    ({ P: { 1: 3, 16: 1, 17: 1 }, R: { 1: 2, 16: 2, 17: 1 }, RR: { 1: 2, 16: 2, 17: 1 } })[g]?.[u] ?? 2;
}
function fmt(k, v, u) {
  if (v === undefined) return '';
  if (v === null) return 'None';
  if (k === 'dateTime') return String(v);
  if (k === 'usUnits') return `${v} (${UNAME[v]})`;
  return Number(v).toFixed(decOf(k, u));
}
const pad = n => String(n).padStart(2, '0');
const hms = ts => { const d = new Date(ts * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const tzName = (() => { try { return new Intl.DateTimeFormat('en-GB', { timeZoneName: 'short' }).formatToParts(new Date()).find(p => p.type === 'timeZoneName').value; } catch { return ''; } })();
const tsStr = ts => { const d = new Date(ts * 1000); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hms(ts)} ${tzName} (${ts})`; };
const startOfInterval = (ts, iv) => Math.floor((ts - 1) / iv) * iv; // weeutil.startOfInterval: a timestamp on a boundary belongs to the interval it ends

// =====================================================================================
//  SVG helpers
// =====================================================================================
function el(tag, attrs = {}, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const defs = el('defs');
defs.innerHTML = `
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  <linearGradient id="busg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#fb923c22"/></pattern>
  <radialGradient id="cloudg"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0d1526"/></radialGradient>`;
const L = { bg: el('g'), conn: el('g'), stat: el('g'), dyn: el('g') };

function box(x, y, w, h, title, sub, id, parent = L.stat) {
  const g = el('g', { class: 'clk', 'data-id': id }, parent);
  el('rect', { x, y, width: w, height: h, rx: 10, class: 'box' }, g);
  if (title) el('text', { x: x + 10, y: y + 18, class: 'ttl' }, g, title);
  if (sub) el('text', { x: x + 10, y: y + 33, class: 'sub mono' }, g, sub);
  if (id) g.addEventListener('click', e => { e.stopPropagation(); showInfo(id); });
  return g;
}
const connEls = {};
function conn(id, d) { const p = el('path', { d, class: 'conn', id }, L.conn); connEls[id] = p; return p; }

// Particle along a path (data flow).
async function flow(pathId, color, ms = 500, { reverse = false, r = 4.5, label = null } = {}) {
  const p = connEls[pathId]; if (!p) return;
  const len = p.getTotalLength();
  const g = el('g', { class: 'glow' }, L.dyn);
  const p0 = p.getPointAtLength(reverse ? len : 0);
  const c = el('circle', { r, fill: color, cx: p0.x, cy: p0.y }, g);
  const tl = label ? el('text', { class: 'tiny mono', fill: color, 'font-size': 10 }, g, label) : null;
  p.classList.add('lit'); p.style.stroke = color + '88';
  try {
    await tween(ms, t => {
      const q = p.getPointAtLength(len * ease(reverse ? 1 - t : t));
      c.setAttribute('cx', q.x); c.setAttribute('cy', q.y);
      if (tl) { tl.setAttribute('x', q.x + 7); tl.setAttribute('y', q.y - 6); }
    });
  } finally { g.remove(); p.classList.remove('lit'); p.style.stroke = ''; }
}
function flowPts(pts, color, ms, r = 4) { // Particle through free points, without a fixed connector
  const g = el('g', { class: 'glow' }, L.dyn); const c = el('circle', { r, fill: color, cx: pts[0][0], cy: pts[0][1] }, g);
  const segs = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); tot += d; }
  return tween(ms, t => {
    let s = ease(t) * tot, i = 0;
    while (i < segs.length - 1 && s > segs[i]) { s -= segs[i]; i++; }
    const f = segs[i] ? s / segs[i] : 1, a = pts[i], b = pts[i + 1];
    c.setAttribute('cx', a[0] + (b[0] - a[0]) * f); c.setAttribute('cy', a[1] + (b[1] - a[1]) * f);
  }).finally(() => g.remove());
}
function ripple(x, y, color, r0 = 6, r1 = 30, ms = 500) {
  const c = el('circle', { cx: x, cy: y, r: r0, fill: 'none', stroke: color, 'stroke-width': 2 }, L.dyn);
  tween(ms, t => { c.setAttribute('r', r0 + (r1 - r0) * t); c.setAttribute('opacity', 1 - t); }).finally(() => c.remove()).catch(() => {});
}
function flashRect(r, color, ms = 600) {
  r.style.stroke = color; r.style.filter = 'url(#glow)';
  sleep(ms).then(() => { r.style.stroke = ''; r.style.filter = ''; }, () => {});
}

// =====================================================================================
//  Layout
// =====================================================================================
const BUS_Y = 350, BUS_X0 = 212, BUS_X1 = 1480;
const GROUPS = [
  { key: 'prep_services', x: 230, w: 138 },
  { key: 'process_services', x: 380, w: 180 },
  { key: 'xtype_services', x: 572, w: 190 },
  { key: 'archive_services', x: 774, w: 152 },
  { key: 'restful_services', x: 938, w: 200 },
  { key: 'report_services', x: 1150, w: 162 },
];
// Order = load order (weewx.all_service_groups, then the list in weewx.conf)
const SVC_DEFS = [
  { id: 'StdTimeSynch', g: 0, mod: 'weewx.engine' },
  { id: 'StdConvert', g: 1, mod: 'weewx.engine' },
  { id: 'StdCalibrate', g: 1, mod: 'weewx.engine' },
  { id: 'StdQC', g: 1, mod: 'weewx.engine' },
  { id: 'StdWXCalculate', g: 1, mod: 'weewx.wxservices' },
  { id: 'StdWXXTypes', g: 2, mod: 'weewx.wxxtypes' },
  { id: 'StdPressureCooker', g: 2, mod: 'weewx.wxxtypes' },
  { id: 'StdRainRater', g: 2, mod: 'weewx.wxxtypes' },
  { id: 'StdDelta', g: 2, mod: 'weewx.wxxtypes' },
  { id: 'StdArchive', g: 3, mod: 'weewx.engine' },
  { id: 'StdStationRegistry', g: 4, mod: 'weewx.restx', proto: 'StationRegistry', host: 'weewx.com/register', interval: 86400 },
  { id: 'StdWunderground', g: 4, mod: 'weewx.restx', proto: 'Wunderground-PWS', host: 'weatherstation.wunderground.com' },
  { id: 'StdPWSweather', g: 4, mod: 'weewx.restx', proto: 'PWSWeather', host: 'pwsupdate.pwsweather.com' },
  { id: 'StdCWOP', g: 4, mod: 'weewx.restx', proto: 'CWOP', host: 'cwop.aprs.net:14580', interval: 600 },
  { id: 'StdWOW', g: 4, mod: 'weewx.restx', proto: 'WOW', host: 'wow.metoffice.gov.uk' },
  { id: 'StdWOWBE', g: 4, mod: 'weewx.restx', proto: 'WOW-BE', host: 'wow.meteo.be' },
  { id: 'StdAWEKAS', g: 4, mod: 'weewx.restx', proto: 'AWEKAS', host: 'data.awekas.at' },
  { id: 'StdPrint', g: 5, mod: 'weewx.engine' },
  { id: 'StdReport', g: 5, mod: 'weewx.engine' },
];

const card = {
  snap: null, obj: null,
  show(obj, title, sub) {
    this.obj = obj; this.snap = { ...obj };
    tCardTitle.textContent = title; tCardSub.textContent = (sub || '').length > 54 ? sub.slice(0, 53) + '…' : (sub || '');
    for (const k of CARD_FIELDS) { const R = cardRows[k]; R.who.textContent = ''; R.bg.setAttribute('fill', 'transparent'); }
    this.render();
  },
  render() {
    const o = this.obj; if (!o) return;
    for (const k of CARD_FIELDS) {
      const R = cardRows[k], has = k in o;
      R.vt.textContent = has ? fmt(k, o[k], o.usUnits) : '—';
      R.vt.setAttribute('fill', !has ? '#334155' : o[k] === null ? '#f87171' : '#e2e8f0');
      R.kt.setAttribute('fill', has ? '#94a3b8' : '#334155');
      R.ut.textContent = has && o[k] !== null ? unitOf(k, o.usUnits) : '';
    }
  },
  update(obj, who, color) { // highlights what the callback changed
    if (obj !== this.obj) this.obj = obj;
    const before = this.snap;
    let n = 0;
    for (const k of CARD_FIELDS) {
      const was = before ? before[k] : undefined, now = obj[k];
      if (was !== now && !(was == null && now == null && (k in before) === (k in obj))) {
        n++; const R = cardRows[k];
        R.bg.setAttribute('fill', color + '38'); R.who.textContent = who.replace(/^Std/, ''); R.who.setAttribute('fill', color);
        sleep(900).then(() => R.bg.setAttribute('fill', 'transparent'), () => {});
      }
    }
    this.snap = { ...obj }; this.render(); return n;
  },
};

const rnd = (a = 1) => (Math.random() - .5) * 2 * a;

// The station keeps measuring while weewxd is down. The Vantage logger keeps storing archive records.
class StationHW {
  constructor(type) {
    this.type = type;
    this.now = Math.floor(Date.now() / 1000 / LOOP_INT) * LOOP_INT;
    this.w = { t: 0, h: 0, b: 0, ws: 0, wd: 0 }; this.raining = false; this.samples = []; this.logger = [];
    this.clockError = type === 'Vantage' ? 7.4 : 0.42; this.outlier = false;
  }
  sample(ts) {
    const d = new Date(ts * 1000), h = d.getHours() + d.getMinutes() / 60, day = Math.sin(2 * Math.PI * (h - 9) / 24);
    const w = this.w;
    w.t = Math.max(-2, Math.min(2, w.t + rnd(.08))); w.h = Math.max(-6, Math.min(6, w.h + rnd(.4)));
    w.b = Math.max(-.03, Math.min(.03, w.b + rnd(.0015))); w.ws = Math.max(-3, Math.min(5, w.ws + rnd(.6))); w.wd = (w.wd + rnd(6)) % 360;
    if (Math.random() < (this.raining ? .05 : .02)) this.raining = !this.raining;
    const outTemp = 54 + 9 * day + w.t, outHumidity = Math.max(8, Math.min(100, 68 - 16 * day + w.h));
    const windSpeed = Math.max(0, 5 + w.ws + rnd(1.2));
    const s = {
      dateTime: ts, usUnits: US, outTemp, inTemp: 70.5 + day * .8 + rnd(.05), outHumidity,
      barometer: 30.02 + .06 * Math.sin(ts / 21600) + w.b, windSpeed, windDir: (230 + w.wd + rnd(12) + 360) % 360,
      windGust: windSpeed + 1 + Math.abs(rnd(3)), rain: this.raining && Math.random() < .55 ? .01 : 0,
      radiation: h > 6.5 && h < 19 ? Math.max(0, 780 * Math.sin(Math.PI * (h - 6.5) / 12.5) + rnd(20)) : 0,
      consBatteryVoltage: 4.62 + rnd(.01) };
    if (this.outlier) { s.outTemp = 300; this.outlier = false; }
    return s;
  }
  advance(sec) {
    for (let t = this.now + LOOP_INT; t <= this.now + sec; t += LOOP_INT) {
      this.samples.push(this.sample(t));
      if (this.type === 'Vantage' && t % ARCH_INT === 0) this.logger.push(this.hwRecord(t));
    }
    this.now += sec;
    if (this.samples.length > 3000) this.samples.splice(0, 1000);
    if (this.logger.length > 500) this.logger.splice(0, 100);
  }
  hwRecord(stop) { // How the Vantage logger delivers its archive records (no console voltage)
    const ss = this.samples.filter(s => s.dateTime > stop - ARCH_INT && s.dateTime <= stop); if (!ss.length) return null;
    const avg = k => ss.reduce((a, s) => a + s[k], 0) / ss.length;
    let x = 0, y = 0; ss.forEach(s => { x += s.windSpeed * Math.sin(s.windDir * Math.PI / 180); y += s.windSpeed * Math.cos(s.windDir * Math.PI / 180); });
    const rain = ss.reduce((a, s) => a + s.rain, 0);
    return { dateTime: stop, usUnits: US, interval: ARCH_INT / 60, outTemp: avg('outTemp'), inTemp: avg('inTemp'), outHumidity: avg('outHumidity'),
      barometer: avg('barometer'), windSpeed: avg('windSpeed'), windDir: (Math.atan2(x, y) * 180 / Math.PI + 360) % 360,
      windGust: Math.max(...ss.map(s => s.windGust)), rain, rainRate: rain * 3600 / ARCH_INT, radiation: avg('radiation') };
  }
  current() { return this.samples[this.samples.length - 1]; }
}

class Driver {
  constructor(hw) { this.hw = hw; this.vantage = hw.type === 'Vantage'; this.rainBuf = []; }
  get module() { return this.vantage ? 'weewx.drivers.vantage' : 'weewx.drivers.simulator'; }
  get archive_interval() { if (!this.vantage) throw new NotImplementedError('archive_interval'); return ARCH_INT; }
  async *genLoopPackets() {
    while (true) {
      thread('MainThread', `${this.vantage ? 'Vantage' : 'Simulator'}.genLoopPackets(): waiting for packet`, '#22d3ee');
      await sleep(LOOP_VIS);
      if (pendingIOError) {
        pendingIOError = false; hlDriver('genLoopPackets', '#f87171', 900);
        ripple(110, 304, '#f87171', 8, 60, 700);
        throw new WeeWxIOError(this.vantage ? 'Max retries exceeded while getting LOOP data' : 'simulated I/O error');
      }
      this.hw.advance(LOOP_INT);
      const s = this.hw.current();
      stationBlink();
      hlDriver('genLoopPackets', '#22d3ee', 400);
      await flow('c_st_drv', '#22d3ee', 180);
      const p = { dateTime: s.dateTime, usUnits: US };
      for (const k of ['outTemp', 'outHumidity', 'inTemp', 'barometer']) p[k] = s[k];
      if (!this.vantage) p.pressure = s.barometer - .745;
      for (const k of ['windSpeed', 'windDir', 'windGust', 'rain']) p[k] = s[k];
      if (this.vantage) { // The Vantage computes rain rate, dewpoint, heat index and wind chill itself.
        this.rainBuf.push([s.dateTime, s.rain]); this.rainBuf = this.rainBuf.filter(([t]) => t > s.dateTime - 900);
        p.rainRate = this.rainBuf.reduce((a, [, r]) => a + r, 0) * 4;
        const d = calc.dewpoint(s.outTemp, s.outHumidity); p.dewpoint = d; p.heatindex = calc.heatindex(s.outTemp, s.outHumidity); p.windchill = calc.windchill(s.outTemp, s.windSpeed);
      }
      p.radiation = s.radiation; p.consBatteryVoltage = s.consBatteryVoltage;
      await flow('c_drv_bus', '#22d3ee', 220);
      yield p;
    }
  }
  async *genArchiveRecords(since) {
    if (!this.vantage) throw new NotImplementedError('genArchiveRecords');
    hlDriver('genArchiveRecords', '#4ade80', 700);
    for (const r of this.hw.logger.filter(r => r && r.dateTime > (since ?? 0))) yield { ...r };
  }
  async *genStartupRecords(since) {
    if (!this.vantage) throw new NotImplementedError('genStartupRecords');
    hlDriver('genStartupRecords', '#4ade80', 900);
    for (const r of this.hw.logger.filter(r => r && r.dateTime > (since ?? 0))) yield { ...r };
  }
  getTime() { return this.hw.now + this.hw.clockError; }
  setTime() { if (!this.vantage) throw new NotImplementedError('setTime'); this.hw.clockError = 0; }
  closePort() { hlDriver('closePort', '#f87171', 800); }
}
function stationBlink() { stationLed.setAttribute('fill', '#4ade80'); sleep(160).then(() => stationLed.setAttribute('fill', '#14532d'), () => {}); updateLcd(); }
function updateLcd() { const s = hw.current(); if (!s) return; tLcd1.textContent = `${s.outTemp.toFixed(1)}°F`; tLcd2.textContent = `${Math.round(s.outHumidity)}%  ${s.barometer.toFixed(2)}"  ${s.windSpeed.toFixed(0)}mph`; }

// Formulas (simplified, US units), roughly as in weewx.wxformulas
const calc = {
  dewpoint(T, RH) { if (T == null || !RH) return null; const c = (T - 32) / 1.8, g = 17.27 * c / (237.7 + c) + Math.log(RH / 100); return (237.7 * g / (17.27 - g)) * 1.8 + 32; },
  windchill(T, V) { if (T == null || V == null) return null; if (T >= 50 || V <= 3) return T; const v = Math.pow(V, .16); return 35.74 + .6215 * T - 35.75 * v + .4275 * T * v; },
  heatindex(T, RH) {
    if (T == null || RH == null) return null; if (T < 40) return T;
    let hi = .5 * (T + 61 + (T - 68) * 1.2 + RH * .094); if (hi < 80) return hi;
    return -42.379 + 2.04901523 * T + 10.14333127 * RH - .22475541 * T * RH - 6.83783e-3 * T * T - 5.481717e-2 * RH * RH + 1.22874e-3 * T * T * RH + 8.5282e-4 * T * RH * RH - 1.99e-6 * T * T * RH * RH; },
  appTemp(T, RH, V) { if (T == null || RH == null || V == null) return null; const c = (T - 32) / 1.8, e = RH / 100 * 6.105 * Math.exp(17.27 * c / (237.7 + c)); return (c + .33 * e - .7 * V * .44704 - 4) * 1.8 + 32; },
  cloudbase(T, RH) { const d = calc.dewpoint(T, RH); if (d == null) return null; return (T - d) / 4.4 * 1000 + ALT_FT; },
  altimeter(P) { if (P == null) return null; const mb = P * 33.8639, h = ALT_FT * .3048, k = .190284;
    return ((mb - .3) * Math.pow(1 + (Math.pow(1013.25, k) * .0065 / 288) * (h / Math.pow(mb - .3, k)), 1 / k)) / 33.8639; },
};

class Accum {
  constructor(start, stop) { this.start = start; this.stop = stop; this.st = {}; this.n = 0; this.unit = null; this.wx = 0; this.wy = 0; }
  addRecord(p, add_hilo = true) {
    if (!(p.dateTime > this.start && p.dateTime <= this.stop)) throw new OutOfSpan();
    if (this.unit == null) this.unit = p.usUnits;
    this.n++;
    for (const k in p) {
      if (k === 'dateTime' || k === 'usUnits' || p[k] == null) continue;
      const s = this.st[k] ??= { min: Infinity, max: -Infinity, sum: 0, cnt: 0, last: null };
      if (add_hilo) { s.min = Math.min(s.min, p[k]); s.max = Math.max(s.max, p[k]); }
      s.sum += p[k]; s.cnt++; s.last = p[k];
    }
    if (p.windSpeed != null && p.windDir != null) { this.wx += p.windSpeed * Math.sin(p.windDir * Math.PI / 180); this.wy += p.windSpeed * Math.cos(p.windDir * Math.PI / 180); }
  }
  extract(k) { // Extractors as in [Accumulator]: sum, max, last, otherwise avg
    const s = this.st[k]; if (!s) return null;
    if (k === 'rain' || k === 'ET') return s.sum;
    if (k === 'windGust') return s.max;
    if (k === 'consBatteryVoltage') return s.last;
    if (k === 'windDir') return (Math.atan2(this.wx, this.wy) * 180 / Math.PI + 360) % 360;
    return s.sum / s.cnt;
  }
  getRecord() { const r = { dateTime: this.stop, usUnits: this.unit }; for (const k in this.st) r[k] = this.extract(k); return r; }
  augmentRecord(r) { const added = []; for (const k in this.st) if (!(k in r)) { r[k] = this.extract(k); added.push(k); } return added; }
}

class Database {
  constructor(unit) { this.rows = []; this.day = {}; this.unit = unit; this.created = false; this.name = 'weewx.sdb'; }
  lastGoodStamp() { return this.rows.length ? this.rows[this.rows.length - 1].dateTime : null; }
  addRecord(rec, accum) {
    this.rows.push(rec);
    for (const k in rec) {
      if (k === 'dateTime' || k === 'usUnits' || k === 'interval' || rec[k] == null) continue;
      const d = this.day[k] ??= { min: Infinity, max: -Infinity, sum: 0, count: 0 };
      d.min = Math.min(d.min, rec[k]); d.max = Math.max(d.max, rec[k]); d.sum += rec[k]; d.count++;
    }
    if (accum) for (const k in accum.st) { // _updateHiLo: extremes from the LOOP packets
      const d = this.day[k]; const s = accum.st[k]; if (!d || !isFinite(s.min)) continue;
      d.min = Math.min(d.min, s.min); d.max = Math.max(d.max, s.max);

}

async function dispatchEvent(eng, ev) {

  const color = EVC[ev.type];
  lifeStack.push(ev.type); lifeSet();
  if (CONF.log_events) log.debug('weewx.engine', `Event type: ${ev.type}` + (ev.packet ? ` | packet: {dateTime: ${ev.packet.dateTime}, …}` : '') + (ev.record ? ` | record: {dateTime: ${ev.record.dateTime}, …}; origin: ${ev.origin}` : ''));
  if (ev.packet) card.show(ev.packet, `event.packet  ·  ${ev.type}`, `Callbacks: ${cbs.map(c => c.svc.id.replace(/^Std/, '')).join(' → ') || '—'}`);
  if (ev.record) card.show(ev.record, `event.record  ·  origin='${ev.origin}'`, `Callbacks: ${cbs.map(c => c.svc.id.replace(/^Std/, '')).join(' → ')}`);
  if (!cbs.length) narrate(ev.type, `<code>dispatchEvent(${ev.type})</code>: no core service has bound a callback. The event is a hook for extensions.`, color);
  const tok = makeToken(ev.type);
  tEngState.textContent = `dispatchEvent(${ev.type})`; tEngState.setAttribute('fill', color);
  tEngState2.textContent = `nesting ${tokens.length} · ${cbs.length} callback(s)`;
  try {
    await call(`dispatchEvent(${ev.type})`, async () => {
      for (const cb of cbs) {

let EPOCH_ID = 0;
class Engine {
  constructor() { this.callbacks = {}; this.services = []; this.console = null; }
  bind(type, svc, name, fn) { (this.callbacks[type] ||= []).push({ svc, name, fn }); }
  async init() {
    await call('StdEngine.__init__(config_dict)', async () => {
      narrate('StdEngine.__init__', 'Create the <code>DBBinder</code>, load the driver via <code>loader()</code>, then instantiate the services in group order. Each service binds its callbacks in its constructor.', '#94a3b8');
      gDriver.querySelector('.sub').textContent = CONF.station === 'Vantage' ? 'weewx.drivers.vantage' : 'weewx.drivers.simulator';
      log.info('weewx.engine', `Loading station type ${CONF.station} (${CONF.station === 'Vantage' ? 'weewx.drivers.vantage' : 'weewx.drivers.simulator'})`);
      hlDriver('loader', '#94a3b8', 700); await sleep(500);
      this.console = new Driver(hw);
      for (const d of SVC_DEFS) {
        let s;
        switch (d.id) {
          case 'StdTimeSynch': s = new StdTimeSynch(this); break;
          case 'StdConvert': s = new StdConvert(this); break;
          case 'StdCalibrate': s = new StdCalibrate(this); break;
          case 'StdQC': s = new StdQC(this); break;
          case 'StdWXCalculate': s = new StdWXCalculate(this); break;
          case 'StdArchive': s = new StdArchive(this); break;
          case 'StdPrint': s = new StdPrint(this); break;
          case 'StdReport': s = new StdReport(this); break;
          default: s = d.g === 4 ? new StdRESTful(this, d.id) : new StdXTypeSvc(this, d.id);
        }
        this.services.push(s);
        const bound = EV.some(e => (this.callbacks[e] || []).some(cb => cb.svc === s));
        pillState(d.id, bound || d.g === 2 ? 'on' : 'off');
        if (d.g === 2) { const reg = { StdWXXTypes: ['WXXTypes', 'ETXType'], StdPressureCooker: ['PressureCooker'], StdRainRater: ['RainRater'], StdDelta: ['Delta'] }[d.id];
          reg.forEach(n => { xtEls[n].g.style.opacity = 1; flashRect(xtEls[n].r, '#a78bfa', 500); }); }
        drawDots(this); drawLegendCounts(this);
        ripple(d.x + 10, d.y + 11, '#94a3b8', 4, 22, 380);
        await sleep(110);
      }
      for (const s of this.services) if (s.start) s.start();
    });
  }
  async run() {
    await call('StdEngine.run()', async () => {
      try {
        await dispatchEvent(this, { type: 'STARTUP' });
        log.info('weewx.engine', 'Starting main packet loop.');
        while (true) {
          checkTerminate();
          await dispatchEvent(this, { type: 'PRE_LOOP' });
          try {
            for await (const packet of this.console.genLoopPackets()) {
              checkTerminate();
              thread('MainThread', 'dispatchEvent(NEW_LOOP_PACKET)', '#22d3ee');
              await dispatchEvent(this, { type: 'NEW_LOOP_PACKET', packet });
              await dispatchEvent(this, { type: 'CHECK_LOOP', packet });
            }
          } catch (e) {
            if (!(e instanceof BreakLoop)) throw e;
            thread('MainThread', 'dispatchEvent(POST_LOOP)', '#f472b6');
            await dispatchEvent(this, { type: 'POST_LOOP' });
          }
        }
      } catch (e) {
        if (e instanceof Abort) throw e;
        log.info('weewx.engine', 'Main loop exiting. Shutting engine down.');
        await this.shutDown(e);
        throw e;
      }
    });
  }
  async shutDown(exc) {
    narrate('StdEngine.shutDown', `Exception <code>${exc.constructor.name}</code>: send <code>SHUTDOWN</code>, then <code>shutDown()</code> on all services in reverse order, close the port and the database.`, EVC.SHUTDOWN);
    try { await dispatchEvent(this, { type: 'SHUTDOWN', error: exc }); } catch (e) { if (e instanceof Abort) throw e; }
    while (this.services.length) {
      const s = this.services[this.services.length - 1];
      await call(`${s.id}.shutDown()`, async () => { pillHot(s.id, EVC.SHUTDOWN); await s.shutDown(); await sleep(70); pillHot(s.id, null); pillState(s.id, 'unloaded'); });
      this.services.pop();
    }
    this.callbacks = {}; drawDots(null); drawLegendCounts(null); xtRegistered(false);
    this.console.closePort(); await sleep(250);
  }
}

// =====================================================================================
//  weewxd: process with its restart loop
// =====================================================================================
async function weewxdMain() {
  PID = 4711 + Math.floor(Math.random() * 3000);
  tWeewxd.textContent = `PID ${PID} · running`; tWeewxd2.textContent = '/etc/weewx/weewx.conf';
  thread('MainThread', 'weewxd.main()', '#94a3b8');
  log.info('__main__', `Initializing weewxd version ${WEEWX_VERSION}`);
  log.info('__main__', 'Using Python 3.12.3 (main) [GCC 13.3.0]');
  log.info('__main__', 'Using configuration file /etc/weewx/weewx.conf');
  log.info('__main__', 'Debug: 0');
  await call('weewxd.main()', async () => {
    while (true) {
      try {
        log.info('__main__', `Starting up weewx version ${WEEWX_VERSION}`);
        engine = new Engine();
        await engine.init();
        await engine.run();
      } catch (e) {
        if (e instanceof Abort) throw e;
        if (e instanceof WeeWxIOError) {
          log.critical('__main__', `Caught WeeWxIOError: ${e.message}`);
          log.critical('__main__', `    ****  Waiting ${RETRY_WAIT.toFixed(1)} seconds then retrying...`);
          narrate('weewxd', `<code>except WeeWxIOError</code>: wait <code>retry_wait</code> = ${RETRY_WAIT} s, then a brand-new <code>StdEngine</code>. The station keeps measuring.`, '#f87171');
          gWeewxd.querySelector('rect').style.stroke = '#f87171';
          thread('MainThread', `time.sleep(${RETRY_WAIT})`, '#f87171');
          for (let s = RETRY_WAIT; s > 0; s -= LOOP_INT) { tWeewxd.textContent = `retry in ${s} s`; hw.advance(LOOP_INT); updateLcd(); await sleep(130); }
          gWeewxd.querySelector('rect').style.stroke = ''; tWeewxd.textContent = `PID ${PID} · running`;
          log.info('__main__', 'retrying...');
          continue;
        }
        if (e instanceof Terminate) {
          log.info('__main__', `Terminating weewx version ${WEEWX_VERSION}`);
          throw e;
        }
        log.critical('__main__', 'Caught unrecoverable exception:'); log.critical('__main__', `    ****  ${e}`); console.error(e);
        throw e;
      }
    }
  });
}
async function processLifecycle() {
  // systemd: starts weewxd, and starts it again after a restart.
  while (true) {
    try { await weewxdMain(); }
    catch (e) {
      if (e instanceof Abort) throw e;
      if (!(e instanceof Terminate)) { narrate('weewxd', 'Unexpected error, see the browser console.', '#f87171'); return; }
    }
    tWeewxd.textContent = 'stopped'; thread('MainThread', 'process exited', '#1e293b');
    for (const k of Object.keys(THREADS)) if (k !== 'MainThread') delete THREADS[k];
    renderThreads();
    narrate('systemd', 'weewxd has exited. systemd starts the service again with the new <code>weewx.conf</code>.', '#94a3b8');
    await sleep(1200); hw.advance(10); updateLcd();
    applyConf();
    log.out('systemd[1]: Started weewx.service - WeeWX weather system.');
  }
}

  engine: { t: 'StdEngine', f: 'src/weewx/engine.py', h: `<p>Holds the driver (<code>console</code>), the <code>DBBinder</code>, the <code>StationInfo</code> and the list of services. <code>bind(event_type, callback)</code> appends callbacks to <code>self.callbacks[event_type]</code>, <code>dispatchEvent(event)</code> calls them one after another, synchronously.</p>

  rest: { t: 'RESTful uploads', f: 'src/weewx/restx.py', h: `<p>Every uploader comes in two parts. The service (<code>StdRESTful</code>) binds <code>NEW_ARCHIVE_RECORD</code> and only puts the record into a <code>queue.Queue</code>. A <code>RESTThread</code> takes it from there, adds rain totals from the database (<code>get_record()</code>), builds the URL and sends it with <code>post_with_retries()</code> (<code>max_tries</code> = 3, <code>retry_wait</code> = 5 s).</p>

  timeline: { t: 'Archive period and archive_delay', f: 'src/weewx/engine.py', h: `<p>The period ends at <code>end_archive_period_ts</code>. The first packet after that triggers <code>END_ARCHIVE_PERIOD</code> and already goes into the new accumulator. The loop keeps running for another <code>archive_delay</code> seconds, though, so that a station with its own memory can finish writing its record. Only then comes <code>BreakLoop</code>.</p>` },

  StdConvert: [['NEW_LOOP_PACKET', 'NEW_ARCHIVE_RECORD'], 'engine.py', `<p>Converts packets and records to <code>target_unit</code> (default US). If the packet is already in that unit system, nothing happens. Otherwise <code>event.packet</code> is replaced by a new dict. All later services and the database only ever see <code>target_unit</code>.</p><p>Try <code>target_unit = METRICWX</code>, then restart.</p>`],

function showInfo(id) {
  let I = INFO[id], evs = null;
  if (id.startsWith('ev:')) {
    const e = id.slice(3), subs = engine ? (engine.callbacks[e] || []).map(c => `${c.svc.id}.${c.name}`) : [];
    I = { t: e, f: 'src/weewx/__init__.py', h: `<p>Bound callbacks in call order:</p><ul>${subs.map(s => `<li><code>${s}</code></li>`).join('') || '<li>none</li>'}</ul>` };
  } else if (SVC_INFO[id]) {
    const [b, f, h] = SVC_INFO[id], d = SVC[id];
    I = { t: `${d.mod}.${id}`, f: `src/weewx/${f}`, h }; evs = b;
  } else if (SVC[id] && SVC[id].g === 4) {
    const d = SVC[id];
    I = { t: `weewx.restx.${id}`, f: 'src/weewx/restx.py', h: `<p>Protocol <code>${d.proto}</code> → <code>${d.host}</code>.${d.interval ? ` <code>post_interval</code> = ${d.interval} s.` : ''}</p>` + INFO.rest.h };
    evs = id === 'StdWunderground' ? ['NEW_ARCHIVE_RECORD', 'NEW_LOOP_PACKET (rapidfire)'] : ['NEW_ARCHIVE_RECORD'];
  } else if (id.startsWith('group:')) {
    const g = id.slice(6);
    I = { t: g, f: 'weewx.conf [Engine] [[Services]]', h: `<p>Service group. Order of the groups: <code>${['prep_services', 'data_services', 'process_services', 'xtype_services', 'archive_services', 'restful_services', 'report_services'].join(' → ')}</code>. <code>data_services</code> is empty by default. Extensions that add data to the packet hook in there.</p>` };
  }
  if (!I) return;
  $('#info').innerHTML = `<h2>Details</h2><h3>${I.t}</h3><div class="file">${I.f}</div>` +
    (evs ? (evs.length ? evPills(evs.map(e => e.split(' ')[0])) : '<div class="file" style="color:#64748b">binds no events</div>') : '') + I.h;
}

showInfo('intro');
requestAnimationFrame(rafLoop);
